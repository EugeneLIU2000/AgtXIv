name: AgtXIv CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Fast validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the complete validation history
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Set up the pinned uv version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Reproduce the project environment
        run: make bootstrap

      - name: Run the offline fast profile
        run: make check

      - name: Reject validator side effects
        run: git diff --exit-code

  site-smoke:
    name: Static site smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Set up the pinned uv version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Reproduce the project environment
        run: make bootstrap

      - name: Assemble and validate the static site
        run: uv run --frozen bash tools/build_pages_site.sh _site

      - name: Reject build side effects outside ignored output
        run: git diff --exit-code

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - fast-validation
      - site-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every M0 CI job
        env:
          FAST_RESULT: ${{ needs.fast-validation.result }}
          SITE_RESULT: ${{ needs.site-smoke.result }}
        run: |
          if [[ "$FAST_RESULT" != "success" || "$SITE_RESULT" != "success" ]]; then
            echo "Required job failed: fast=$FAST_RESULT site=$SITE_RESULT" >&2
            exit 1
          fi
