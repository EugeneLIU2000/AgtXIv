<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="880" viewBox="0 0 1680 880"><defs><marker id="mk9AA2AC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#9AA2AC"/></marker><marker id="mk2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#2563EB"/></marker><marker id="mkDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#DC2626"/></marker></defs><rect width="1680" height="880" fill="#FFFFFF"/><text x="64" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="1.6">AGTXIV · METHOD OVERVIEW</text><text x="64" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#14171C" text-anchor="start">Resolving a theorem query into a verified dependency path</text><text x="64" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">A query is answered by a build receipt, not a reading list. Backward archaeology finds the load-bearing imports; forward verification rebuilds only what is missing.</text><rect x="64" y="140" width="366" height="70" rx="8" ry="8" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.8"/><text x="82" y="167" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="start">theorem query</text><text x="82" y="191" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#14171C" text-anchor="start">claim:closed-form-rom</text><path d="M 247.0 210 L 247.0 280" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mkDC2626)"/><text x="64" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#DC2626" text-anchor="start" letter-spacing="0.8">1 · BACKWARD  —  dependency archaeology</text><text x="488" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="0.8">2 · FORWARD  —  verification build</text><rect x="64" y="288" width="366" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/><text x="247.0" y="324.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14171C" text-anchor="middle">target claim</text><text x="247.0" y="342.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">the statement actually asked for</text><path d="M 247.0 366 L 247.0 396" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mkDC2626)"/><rect x="64" y="400" width="366" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><text x="247.0" y="436.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14171C" text-anchor="middle">direct local support</text><text x="247.0" y="454.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">what this paper proves itself</text><path d="M 247.0 478 L 247.0 508" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mkDC2626)"/><rect x="64" y="512" width="366" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><text x="247.0" y="548.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14171C" text-anchor="middle">imported premises</text><text x="247.0" y="566.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">exact claim + version, not the paper</text><path d="M 247.0 590 L 247.0 620" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mkDC2626)"/><rect x="64" y="624" width="366" height="78" rx="8" ry="8" fill="#FCEAEA" stroke="#DC2626" stroke-width="1.8"/><text x="247.0" y="660.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14171C" text-anchor="middle">root contracts</text><text x="247.0" y="678.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">accepted, reusable, or declared frontier</text><rect x="488" y="288" width="366" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/><text x="671.0" y="324.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14171C" text-anchor="middle">verified root exports</text><text x="671.0" y="342.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">reused unchanged, never rebuilt</text><path d="M 671.0 366 L 671.0 396" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><rect x="488" y="400" width="366" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><text x="671.0" y="436.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14171C" text-anchor="middle">intermediate local delta</text><text x="671.0" y="454.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">only this paper's new reasoning</text><path d="M 671.0 478 L 671.0 508" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><rect x="488" y="512" width="366" height="78" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><text x="671.0" y="548.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14171C" text-anchor="middle">target local delta</text><text x="671.0" y="566.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">the residual that must be proved</text><path d="M 671.0 590 L 671.0 620" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><rect x="488" y="624" width="366" height="78" rx="8" ry="8" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.8"/><text x="671.0" y="660.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14171C" text-anchor="middle">versioned target export</text><text x="671.0" y="678.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">scoped contract + status vector</text><path d="M 247.0 702 L 247.0 732 Q 247.0 746 261.0 746 L 445.0 746 Q 459.0 746 459.0 732 L 459.0 341.0 Q 459.0 327.0 473.0 327.0 L 481 327.0" fill="none" stroke="#9AA2AC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#mk9AA2AC)"/><text x="467.0" y="768" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="start">roots fixed  →  build forward</text><text x="912" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14171C" text-anchor="start" letter-spacing="0.8">3 · QUERYRESOLUTION  —  the receipt</text><rect x="912" y="288" width="704" height="66" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="934" cy="321" r="5.5" fill="#2563EB" stroke="none" stroke-width="0"/><text x="954" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14171C" text-anchor="start">accepted imports</text><text x="954" y="337" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="start">reused from the registry</text><rect x="912" y="362" width="704" height="66" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="934" cy="395" r="5.5" fill="#2563EB" stroke="none" stroke-width="0"/><text x="954" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14171C" text-anchor="start">dependency closure</text><text x="954" y="411" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="start">everything actually used</text><rect x="912" y="436" width="704" height="66" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="934" cy="469" r="5.5" fill="#14171C" stroke="none" stroke-width="0"/><text x="954" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14171C" text-anchor="start">local delta</text><text x="954" y="485" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="start">what this query had to build</text><rect x="912" y="510" width="704" height="66" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="934" cy="543" r="5.5" fill="#DC2626" stroke="none" stroke-width="0"/><text x="954" y="538" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14171C" text-anchor="start">blocked frontier</text><text x="954" y="559" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="start">first unresolved source</text><rect x="912" y="584" width="704" height="66" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="934" cy="617" r="5.5" fill="#9AA2AC" stroke="none" stroke-width="0"/><text x="954" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14171C" text-anchor="start">dependency versions</text><text x="954" y="633" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="start">pins the whole closure</text><rect x="912" y="668" width="704" height="96" rx="8" ry="8" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="934" y="698" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#14171C" text-anchor="start">Cached, then reused.</text><text x="934" y="722" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">A later query sharing a prefix inherits the accepted</text><text x="934" y="742" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">closure and pays only for its own delta.</text><rect x="64" y="784" width="1552" height="58" rx="8" ry="8" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="86" y="818.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14171C" text-anchor="start">Two invariants:</text><text x="211.60000000000002" y="818.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#14171C" text-anchor="start">the reusable unit is the claim-level contract, not the paper — and the frontier is reported, never hidden.</text><text x="1616" y="860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#9AA2AC" text-anchor="end">AgtXIv v0.4  ·  §2.1 two opposite directions  ·  §2.5 QueryResolution</text></svg>