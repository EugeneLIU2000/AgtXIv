<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="880" viewBox="0 0 1680 880"><defs><marker id="mk2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#2563EB"/></marker><marker id="mk9AA2AC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#9AA2AC"/></marker><marker id="mk3A4048" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#3A4048"/></marker><marker id="mkDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#DC2626"/></marker></defs><rect width="1680" height="880" fill="#FFFFFF"/><text x="64" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="1.6">AGTXIV · LIFECYCLE AND FAILURE SEMANTICS</text><text x="64" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#14171C" text-anchor="start">A failed check refines the graph locally — it never silently promotes</text><text x="64" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">Every node carries a lifecycle state. A failure is classified before it is repaired, and two different kinds of red are never merged into one.</text><text x="64" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.3">LIFECYCLE OF A NODE, CHAIN, OR EXPORT</text><rect x="64" y="194" width="75.03999999999999" height="32" rx="16.0" ry="16.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="101.52" y="214.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#3A4048" text-anchor="middle">PROPOSED</text><path d="M 145.04 210 L 169.04 210" fill="none" stroke="#9AA2AC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="175.04" y="194" width="132.07999999999998" height="32" rx="16.0" ry="16.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="241.07999999999998" y="214.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#3A4048" text-anchor="middle">SOURCE_VALIDATED</text><path d="M 313.12 210 L 337.12 210" fill="none" stroke="#9AA2AC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="343.12" y="194" width="139.20999999999998" height="32" rx="16.0" ry="16.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="412.725" y="214.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#3A4048" text-anchor="middle">DEPENDENCY_MAPPED</text><path d="M 488.33 210 L 512.3299999999999 210" fill="none" stroke="#9AA2AC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="518.3299999999999" y="194" width="146.34" height="32" rx="16.0" ry="16.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="591.4999999999999" y="214.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#3A4048" text-anchor="middle">PARTIALLY_VERIFIED</text><path d="M 670.67 210 L 694.67 210" fill="none" stroke="#9AA2AC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="700.67" y="194" width="153.47" height="32" rx="16.0" ry="16.0" fill="#E8EFFD" stroke="none" stroke-width="0"/><text x="777.405" y="214.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#2563EB" text-anchor="middle">VERIFICATION_CLOSED</text><rect x="64" y="260" width="65.74000000000001" height="28" rx="14.0" ry="14.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="96.87" y="278.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">BLOCKED</text><text x="141.74" y="279" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7480" text-anchor="start">an import or evidence is unresolved</text><rect x="409.74" y="260" width="72.56" height="28" rx="14.0" ry="14.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="446.02" y="278.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">DISPUTED</text><text x="494.3" y="279" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7480" text-anchor="start">the literature does not agree</text><rect x="723.9000000000001" y="260" width="86.2" height="28" rx="14.0" ry="14.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="767.0000000000001" y="278.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">SUPERSEDED</text><text x="822.1000000000001" y="279" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7480" text-anchor="start">a newer version replaces it</text><text x="64" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#14171C" text-anchor="start">VERIFICATION_CLOSED is query-scoped: every axis relevant to the declared scope is acceptable — for this query.</text><text x="64" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">It is not universal certainty, and it does not propagate upward on its own.</text><line x1="64" y1="376" x2="1616" y2="376" stroke="#E6EAF0" stroke-width="1.5" stroke-linecap="round"/><text x="64" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.3">A FAILURE IS CLASSIFIED BEFORE IT IS REPAIRED</text><rect x="64.0" y="438" width="493.3333333333333" height="214" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><rect x="84.0" y="458" width="141.69" height="26" rx="13.0" ry="13.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="154.845" y="475.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">LOCAL_BUILD_FAILURE</text><text x="84.0" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">missing lemma, bridge, unfolding, or premise</text><text x="84.0" y="533" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">retrieval</text><path d="M 310.66666666666663 550 L 310.66666666666663 570" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><rect x="84.0" y="578" width="96.12" height="26" rx="13.0" ry="13.0" fill="#E8EFFD" stroke="none" stroke-width="0"/><text x="132.06" y="595.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="middle">EXPAND_LOCAL</text><text x="84.0" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#3A4048" text-anchor="start">add the missing step, rebuild this region only</text><rect x="593.3333333333333" y="438" width="493.3333333333333" height="214" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><rect x="613.3333333333333" y="458" width="128.67000000000002" height="26" rx="13.0" ry="13.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="677.6683333333333" y="475.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">ALIGNMENT_FAILURE</text><text x="613.3333333333333" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">wrong object, lost assumption, scope or</text><text x="613.3333333333333" y="533" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">exactness drift</text><path d="M 839.9999999999999 550 L 839.9999999999999 570" fill="none" stroke="#3A4048" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk3A4048)"/><rect x="613.3333333333333" y="578" width="128.67000000000002" height="26" rx="13.0" ry="13.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="677.6683333333333" y="595.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">REWIRE_OR_RESCOPE</text><text x="613.3333333333333" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#3A4048" text-anchor="start">re-encode or narrow the claim, then re-audit</text><rect x="1122.6666666666665" y="438" width="493.3333333333333" height="214" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><rect x="1142.6666666666665" y="458" width="174.24" height="26" rx="13.0" ry="13.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="1229.7866666666664" y="475.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">SOURCE_OR_FOUNDATION_GAP</text><text x="1142.6666666666665" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">unsupported import, missing source step,</text><text x="1142.6666666666665" y="533" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">counterexample</text><path d="M 1369.3333333333333 550 L 1369.3333333333333 570" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mkDC2626)"/><rect x="1142.6666666666665" y="578" width="128.67000000000002" height="26" rx="13.0" ry="13.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="1207.0016666666666" y="595.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">ESCALATE_OR_BLOCK</text><text x="1142.6666666666665" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#3A4048" text-anchor="start">record the blocker; do not fill the gap with</text><text x="1142.6666666666665" y="637" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#3A4048" text-anchor="start">prose</text><text x="64" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="start" letter-spacing="1.3">TWO DIFFERENT REDS — MERGING THEM DESTROYS THE INFORMATION</text><rect x="64" y="718" width="758.0" height="128" rx="8" ry="8" fill="#FFFFFF" stroke="#E8B4B0" stroke-width="1.6"/><rect x="86" y="738" width="79.38" height="26" rx="13.0" ry="13.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="125.69" y="755.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">PROOF_GAP</text><rect x="214" y="738" width="147.58" height="26" rx="13.0" ry="13.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="287.79" y="755.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#3A4048" text-anchor="middle">THEOREM_NOT_REFUTED</text><text x="86" y="792" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#14171C" text-anchor="start">The route is incomplete; the statement still stands.</text><text x="86" y="816" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7480" text-anchor="start">Record a repair path and keep the claim conditional.</text><rect x="858.0" y="718" width="758.0" height="128" rx="8" ry="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.9"/><rect x="880.0" y="738" width="93.02000000000001" height="26" rx="13.0" ry="13.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="926.51" y="755.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">CLAIM_FALSE</text><rect x="1012.0" y="738" width="174.86" height="26" rx="13.0" ry="13.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="1099.43" y="755.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">EXPLICIT_COUNTEREXAMPLE</text><text x="880.0" y="792" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#14171C" text-anchor="start">A concrete instance refutes it — it must be retracted.</text><text x="880.0" y="816" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7480" text-anchor="start">Export only the properties that survive.</text><text x="1616" y="860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#9AA2AC" text-anchor="end">AgtXIv v0.4  ·  §6.3 DAG completion and iterative resolution  ·  §6.5 lifecycle status  ·  §6.6 public justification</text></svg>