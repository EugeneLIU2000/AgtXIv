<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900"><defs><marker id="mk2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#2563EB"/></marker><marker id="mkD4D9E0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#D4D9E0"/></marker></defs><rect width="1680" height="900" fill="#FFFFFF"/><text x="64" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="1.6">AGTXIV · VERIFICATION SEMANTICS</text><text x="64" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#14171C" text-anchor="start">One claim carries four independent verification axes</text><text x="64" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">Each axis answers a different question, has its own status enum, and is promoted by its own evidence. Collapsing them into a single Boolean destroys the information a reader needs.</text><rect x="64" y="250" width="268" height="132" rx="8" ry="8" fill="#14171C" stroke="none" stroke-width="0"/><text x="84" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#8FA6D8" text-anchor="start" letter-spacing="1.4">ONE CLAIM</text><text x="84" y="316" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="normal" fill="#FFFFFF" text-anchor="start">claim:closed-form-rom</text><text x="84" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#B9C4DA" text-anchor="start">not one status —</text><text x="84" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#B9C4DA" text-anchor="start">a status vector</text><rect x="396" y="196" width="470" height="128" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="430" cy="236" r="14" fill="#3A4048" stroke="none" stroke-width="0"/><text x="430" y="241" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="456" y="241" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14171C" text-anchor="start">Source fidelity</text><text x="418" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">What did the paper actually state?</text><text x="418" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#9AA2AC" text-anchor="start">independent of the other three</text><text x="892" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.2">STATUS ENUM</text><rect x="892" y="232" width="76.59" height="24" rx="12.0" ry="12.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="930.295" y="248.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">UNCHECKED</text><rect x="892" y="262" width="57.06" height="24" rx="12.0" ry="12.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="920.53" y="278.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">PASSED</text><rect x="892" y="292" width="83.1" height="24" rx="12.0" ry="12.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="933.55" y="308.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">MISALIGNED</text><text x="1218" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.2">PROMOTED ONLY BY</text><text x="1218" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">frozen source bundle + span-level anchor</text><text x="1218" y="265" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">review</text><path d="M 332 316.0 L 354 316.0 Q 366 316.0 366 304.0 L 366 272.0 Q 366 260.0 378 260.0 L 389 260.0" fill="none" stroke="#D4D9E0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mkD4D9E0)"/><rect x="396" y="340" width="470" height="128" rx="8" ry="8" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.8"/><circle cx="430" cy="380" r="14" fill="#2563EB" stroke="none" stroke-width="0"/><text x="430" y="385" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="456" y="385" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14171C" text-anchor="start">Mathematical correctness</text><text x="418" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">Does the conclusion follow from the encoded assumptions?</text><text x="418" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#9AA2AC" text-anchor="start">independent of the other three</text><text x="892" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.2">STATUS ENUM</text><rect x="892" y="376" width="148.2" height="24" rx="12.0" ry="12.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="966.1" y="392.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">PARTIALLY_FORMALIZED</text><rect x="892" y="406" width="109.14" height="24" rx="12.0" ry="12.0" fill="#E8EFFD" stroke="none" stroke-width="0"/><text x="946.57" y="422.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="middle">KERNEL_CHECKED</text><rect x="892" y="436" width="57.06" height="24" rx="12.0" ry="12.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="920.53" y="452.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">FAILED</text><text x="1218" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.2">PROMOTED ONLY BY</text><text x="1218" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">Lean 4 + pinned mathlib, no sorry /</text><text x="1218" y="409" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">admit</text><path d="M 332 316.0 L 354 316.0 Q 366 316.0 366 328.0 L 366 392.0 Q 366 404.0 378 404.0 L 389 404.0" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><rect x="396" y="484" width="470" height="128" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="430" cy="524" r="14" fill="#3A4048" stroke="none" stroke-width="0"/><text x="430" y="529" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="456" y="529" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14171C" text-anchor="start">Computational reproducibility</text><text x="418" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">Can the reported number be regenerated?</text><text x="418" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#9AA2AC" text-anchor="start">independent of the other three</text><text x="892" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.2">STATUS ENUM</text><rect x="892" y="520" width="102.63" height="24" rx="12.0" ry="12.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="943.315" y="536.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">NOT_ATTEMPTED</text><rect x="892" y="550" width="83.1" height="24" rx="12.0" ry="12.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="933.55" y="566.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">REPRODUCED</text><rect x="892" y="580" width="63.57" height="24" rx="12.0" ry="12.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="923.785" y="596.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">BLOCKED</text><text x="1218" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.2">PROMOTED ONLY BY</text><text x="1218" y="534" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">code + data + seed + tolerance, rerun</text><text x="1218" y="553" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">from a clean checkout</text><path d="M 332 316.0 L 354 316.0 Q 366 316.0 366 328.0 L 366 536.0 Q 366 548.0 378 548.0 L 389 548.0" fill="none" stroke="#D4D9E0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mkD4D9E0)"/><rect x="396" y="628" width="470" height="128" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="430" cy="668" r="14" fill="#3A4048" stroke="none" stroke-width="0"/><text x="430" y="673" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="456" y="673" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14171C" text-anchor="start">Physical-semantic alignment</text><text x="418" y="706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">Does the formal object mean the intended physics?</text><text x="418" y="732" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#9AA2AC" text-anchor="start">independent of the other three</text><text x="892" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.2">STATUS ENUM</text><rect x="892" y="664" width="109.14" height="24" rx="12.0" ry="12.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="946.57" y="680.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">AGENT_REVIEWED</text><rect x="892" y="694" width="109.14" height="24" rx="12.0" ry="12.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="946.57" y="710.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">HUMAN_REVIEWED</text><rect x="892" y="724" width="76.59" height="24" rx="12.0" ry="12.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="930.295" y="740.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">CONTESTED</text><text x="1218" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.2">PROMOTED ONLY BY</text><text x="1218" y="678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">domain reviewer — no kernel can decide</text><text x="1218" y="697" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#3A4048" text-anchor="start">this</text><path d="M 332 316.0 L 354 316.0 Q 366 316.0 366 328.0 L 366 680.0 Q 366 692.0 378 692.0 L 389 692.0" fill="none" stroke="#D4D9E0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mkD4D9E0)"/><rect x="64" y="796" width="1552" height="62" rx="8" ry="8" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="88" y="834" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#DC2626" text-anchor="start">A clean Lean build answers axis 2 only</text><text x="388" y="834" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14171C" text-anchor="start">— and only under the definitions you encoded. It certifies nothing on axes 1, 3, or 4.</text><text x="1616" y="880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#9AA2AC" text-anchor="end">AgtXIv v0.4  ·  §3 trusted verification layers 