<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="720" viewBox="0 0 1680 720"><defs><marker id="mk3A4048" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#3A4048"/></marker><marker id="mkDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#DC2626"/></marker></defs><rect width="1680" height="720" fill="#FFFFFF"/><text x="64" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="1.6">AGTXIV · FORMALIZATION LOOP</text><text x="64" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#14171C" text-anchor="start">Lean is the trusted kernel — it is not an oracle for physics</text><text x="64" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">The kernel decides one thing: does the conclusion follow from the encoded assumptions. Whether the encoding is the intended object is decided by a separate, source-blind audit.</text><rect x="64" y="176" width="300" height="108" rx="8" ry="8" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.8"/><text x="214.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14171C" text-anchor="middle">MathClaimIR</text><text x="214.0" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">normalized statement,</text><text x="214.0" y="251" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">quantifiers, domain</text><path d="M 368 230.0 L 406 230.0" fill="none" stroke="#3A4048" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk3A4048)"/><rect x="410" y="176" width="300" height="108" rx="8" ry="8" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.8"/><text x="560.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14171C" text-anchor="middle">Lean 4 + mathlib</text><text x="560.0" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">pinned environment,</text><text x="560.0" y="251" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">no sorry / admit</text><path d="M 714 230.0 L 752 230.0" fill="none" stroke="#3A4048" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk3A4048)"/><rect x="756" y="176" width="300" height="108" rx="8" ry="8" fill="#FFFFFF" stroke="#14171C" stroke-width="1.8"/><text x="906.0" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14171C" text-anchor="middle">source-blind</text><text x="906.0" y="219" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14171C" text-anchor="middle">backtranslation</text><text x="906.0" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">restate the declaration</text><text x="906.0" y="259" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">without seeing the paper</text><path d="M 1060 230.0 L 1098 230.0" fill="none" stroke="#3A4048" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk3A4048)"/><rect x="1102" y="176" width="300" height="108" rx="8" ry="8" fill="#FCEAEA" stroke="#DC2626" stroke-width="1.8"/><text x="1252.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14171C" text-anchor="middle">alignment audit</text><text x="1252.0" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">does the restatement</text><text x="1252.0" y="251" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">match the source claim?</text><path d="M 1252.0 284 L 1252.0 322" fill="none" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mkDC2626)"/><rect x="1102" y="336" width="300" height="62" rx="8" ry="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/><text x="1252.0" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">aligned</text><text x="1252.0" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">promote the math axis only</text><rect x="1102" y="414" width="300" height="62" rx="8" ry="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/><text x="1252.0" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">drift detected</text><text x="1252.0" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">rewire or rescope, do not promote</text><path d="M 1102 445 L 1080 445 Q 1068 445 1068 433 L 1068 308 Q 1068 296 1056 296 L 226.0 296 Q 214.0 296 214.0 284" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#mkDC2626)"/><text x="232.0" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#DC2626" text-anchor="start">repair the encoding, re-enter the loop</text><rect x="64" y="512" width="756.0" height="150" rx="8" ry="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/><rect x="86" y="532" width="113.48" height="26" rx="13.0" ry="13.0" fill="#E8EFFD" stroke="none" stroke-width="0"/><text x="142.74" y="549.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">KERNEL_CHECKED</text><text x="86" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14171C" text-anchor="start">The conclusion follows from the definitions</text><text x="86" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14171C" text-anchor="start">and assumptions you encoded.</text><text x="86" y="638" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7480" text-anchor="start">Mechanically checkable. Reproducible from a clean environment.</text><rect x="860.0" y="512" width="756.0" height="150" rx="8" ry="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/><rect x="882.0" y="532" width="120.30000000000001" height="26" rx="13.0" ry="13.0" fill="#FCEAEA" stroke="none" stroke-width="0"/><text x="942.15" y="549.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">STILL UNDECIDED</text><text x="882.0" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14171C" text-anchor="start">Whether that encoding is the physical object,</text><text x="882.0" y="612" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#14171C" text-anchor="start">regime, and observable you meant.</text><text x="882.0" y="638" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7480" text-anchor="start">Needs a domain reviewer. No kernel can settle it.</text><text x="1616" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#9AA2AC" text-anchor="end">AgtXIv v0.4  ·  §3.2 mathematical kernel  ·  §8.7 kernel checks  ·  §8.8 semantic-alignment review</text></svg>