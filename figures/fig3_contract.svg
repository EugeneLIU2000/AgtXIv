<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="800" viewBox="0 0 1680 800"><defs><marker id="mk2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#2563EB"/></marker><marker id="mk9AA2AC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#9AA2AC"/></marker></defs><rect width="1680" height="800" fill="#FFFFFF"/><text x="64" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="1.6">AGTXIV · MINIMAL DATA MODEL</text><text x="64" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#14171C" text-anchor="start">The reusable unit is a claim-level contract, not a paper</text><text x="64" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">A citation binds two documents. A MathContract binds one normalized statement to one version, so a later query can import it without re-reading the paper.</text><text x="64" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.3">WHAT THE DEPENDENCY BINDS TO</text><rect x="64" y="180" width="456" height="158" rx="8" ry="8" fill="#FFFFFF" stroke="#D4D9E0" stroke-width="1.4"/><text x="86" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B7480" text-anchor="start">paper-level  (citation graph)</text><rect x="86" y="228" width="172" height="46" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.2"/><text x="172" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#3A4048" text-anchor="middle">Paper A</text><rect x="326" y="228" width="172" height="46" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.2"/><text x="412" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#3A4048" text-anchor="middle">Paper B</text><path d="M 258 251 L 326 251" fill="none" stroke="#9AA2AC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><text x="292" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#9AA2AC" text-anchor="middle">cites</text><text x="86" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#DC2626" text-anchor="start">Which result? Under which hypotheses?</text><text x="86" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#DC2626" text-anchor="start">Load-bearing, or background? Unanswerable.</text><rect x="64" y="366" width="456" height="176" rx="8" ry="8" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.8"/><text x="86" y="396" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start">claim-level  (AgtXIv)</text><rect x="86" y="414" width="190" height="52" rx="8" ry="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/><text x="181" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#14171C" text-anchor="middle">A · Claim A.3</text><text x="181" y="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#6B7480" text-anchor="middle">the importing statement</text><rect x="308" y="414" width="190" height="52" rx="8" ry="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/><text x="403" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#14171C" text-anchor="middle">B · Theorem B.2</text><text x="403" y="455" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#6B7480" text-anchor="middle">the imported statement</text><path d="M 276 440 L 308 440" fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><text x="86" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#14171C" text-anchor="start">IMPORTS  +  an explicit assumption-matching record</text><text x="86" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A4048" text-anchor="start">pinned to a contract version, so it can be reused</text><text x="576" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.3">MATHCONTRACT — WHAT ONE RECORD MUST CARRY</text><rect x="576" y="180" width="1040" height="466" rx="8" ry="8" fill="#FFFFFF" stroke="#14171C" stroke-width="1.8"/><rect x="576" y="180" width="1040" height="52" rx="8" ry="8" fill="#14171C" stroke="none" stroke-width="0"/><rect x="576" y="220" width="1040" height="12" rx="0" ry="0" fill="#14171C" stroke="none" stroke-width="0"/><text x="598" y="213" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#FFFFFF" text-anchor="start">math-contract:claim.closed-form-rom</text><rect x="1484" y="194" width="45.28" height="24" rx="12.0" ry="12.0" fill="#2E3440" stroke="none" stroke-width="0"/><text x="1506.64" y="210.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9FB4E8" text-anchor="middle">v0.4</text><circle cx="602" cy="264" r="4" fill="#14171C" stroke="none" stroke-width="0"/><text x="620" y="269" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14171C" text-anchor="start">normalized statement</text><text x="826" y="269" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">quantifiers · domain · exactness</text><line x1="598" y1="282" x2="1594" y2="282" stroke="#EDF0F4" stroke-width="1" stroke-linecap="round"/><circle cx="602" cy="304" r="4" fill="#14171C" stroke="none" stroke-width="0"/><text x="620" y="309" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14171C" text-anchor="start">assumptions</text><text x="826" y="309" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">no Pauli-active dependency; G_M perfect</text><line x1="598" y1="322" x2="1594" y2="322" stroke="#EDF0F4" stroke-width="1" stroke-linecap="round"/><circle cx="602" cy="344" r="4" fill="#2563EB" stroke="none" stroke-width="0"/><text x="620" y="349" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14171C" text-anchor="start">theorem imports</text><text x="826" y="349" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">exact-graph-program · perfect-graph-antiblocker</text><line x1="598" y1="362" x2="1594" y2="362" stroke="#EDF0F4" stroke-width="1" stroke-linecap="round"/><circle cx="602" cy="384" r="4" fill="#14171C" stroke="none" stroke-width="0"/><text x="620" y="389" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14171C" text-anchor="start">source anchor</text><text x="826" y="389" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">frozen bundle hash + span in draft.tex</text><line x1="598" y1="402" x2="1594" y2="402" stroke="#EDF0F4" stroke-width="1" stroke-linecap="round"/><circle cx="602" cy="424" r="4" fill="#2563EB" stroke="none" stroke-width="0"/><text x="620" y="429" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14171C" text-anchor="start">Lean binding</text><text x="826" y="429" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">declaration, or an explicit GAP — never blank</text><line x1="598" y1="442" x2="1594" y2="442" stroke="#EDF0F4" stroke-width="1" stroke-linecap="round"/><circle cx="602" cy="464" r="4" fill="#14171C" stroke="none" stroke-width="0"/><text x="620" y="469" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14171C" text-anchor="start">status vector</text><text x="826" y="469" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">one value per axis, never one Boolean</text><line x1="598" y1="482" x2="1594" y2="482" stroke="#EDF0F4" stroke-width="1" stroke-linecap="round"/><circle cx="602" cy="504" r="4" fill="#DC2626" stroke="none" stroke-width="0"/><text x="620" y="509" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14171C" text-anchor="start">blockers</text><text x="826" y="509" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">what stops promotion, named and open</text><rect x="598" y="550" width="996" height="74" rx="8" ry="8" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="616" y="577" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A4048" text-anchor="start">An importer binds to</text><rect x="754" y="562" width="106.66" height="24" rx="12.0" ry="12.0" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="807.33" y="578.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">contract@v0.4</text><text x="896" y="577" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#3A4048" text-anchor="start">— not to “the paper”.</text><text x="616" y="605" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7480" text-anchor="start">An upstream version bump invalidates only the affected downstream closure.</text><text x="576" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.3">A CONTRACT NEED NOT REACH ACCEPTANCE IN ONE PASS</text><rect x="576" y="708" width="63.57" height="28" rx="14.0" ry="14.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="607.785" y="726.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">INDEXED</text><path d="M 644.57 722 L 664.57 722" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="669.5699999999999" y="708" width="83.1" height="28" rx="14.0" ry="14.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="711.1199999999999" y="726.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">NORMALIZED</text><path d="M 757.67 722 L 777.67 722" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="782.67" y="708" width="128.67000000000002" height="28" rx="14.0" ry="14.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="847.005" y="726.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">DEPENDENCY_MAPPED</text><path d="M 916.3399999999999 722 L 936.3399999999999 722" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="941.3399999999999" y="708" width="135.18" height="28" rx="14.0" ry="14.0" fill="#F4F6F8" stroke="none" stroke-width="0"/><text x="1008.93" y="726.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#3A4048" text-anchor="middle">FORMALLY_CONNECTED</text><path d="M 1081.52 722 L 1101.52 722" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="1106.52" y="708" width="128.67000000000002" height="28" rx="14.0" ry="14.0" fill="#E8EFFD" stroke="none" stroke-width="0"/><text x="1170.855" y="726.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="middle">ACCEPTED_CONTRACT</text><text x="64" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.3">WHY THIS MATTERS</text><text x="64" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#3A4048" text-anchor="start">A paper exports many results at different maturity.</text><text x="64" y="632" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#3A4048" text-anchor="start">Binding reuse to the paper inherits all of them —</text><text x="64" y="654" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#3A4048" text-anchor="start">including the ones that are still unverified.</text><text x="1616" y="780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#9AA2AC" text-anchor="end">AgtXIv v0.4  ·  §2.3 claim-level inheritance  ·  §5.0 MathContract  ·  §2.6 progressive standardization</text></svg>