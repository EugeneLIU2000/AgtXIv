<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="760" viewBox="0 0 1680 760"><defs><marker id="mk2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#2563EB"/></marker><marker id="mk9AA2AC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#9AA2AC"/></marker><marker id="mkDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="#DC2626"/></marker></defs><rect width="1680" height="760" fill="#FFFFFF"/><text x="64" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="1.6">AGTXIV · QUERY EXECUTION</text><text x="64" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#14171C" text-anchor="start">The registry behaves like a package manager with an incremental build</text><text x="64" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6B7480" text-anchor="start">The expensive offline path standardizes contracts once. The online path reuses the accepted closure and pays only for the frontier that is actually missing.</text><text x="64" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.3">OFFLINE  —  done once, amortised over every later query</text><rect x="64" y="190" width="232" height="54" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.3"/><text x="180.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#14171C" text-anchor="middle">freeze sources</text><path d="M 298 217 L 312 217" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="314" y="190" width="232" height="54" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.3"/><text x="430.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#14171C" text-anchor="middle">extract candidates</text><path d="M 548 217 L 562 217" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="564" y="190" width="232" height="54" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.3"/><text x="680.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#14171C" text-anchor="middle">normalize contracts</text><path d="M 798 217 L 812 217" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="814" y="190" width="232" height="54" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.3"/><text x="930.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#14171C" text-anchor="middle">map dependencies</text><path d="M 1048 217 L 1062 217" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="1064" y="190" width="232" height="54" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.3"/><text x="1180.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#14171C" text-anchor="middle">connect declarations</text><path d="M 1298 217 L 1312 217" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="1314" y="190" width="232" height="54" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.3"/><text x="1430.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#14171C" text-anchor="middle">cache verified closures</text><line x1="64" y1="280" x2="1616" y2="280" stroke="#E6EAF0" stroke-width="1.5" stroke-linecap="round"/><text x="64" y="316" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="1.3">ONLINE  —  what a single query actually costs</text><rect x="64" y="342" width="232" height="96" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="90" cy="368" r="13" fill="#3A4048" stroke="none" stroke-width="0"/><text x="90" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="180.0" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2" font-weight="600" fill="#14171C" text-anchor="middle">normalize the query</text><text x="180.0" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6B7480" text-anchor="middle">resolve to a contract address</text><path d="M 298 390.0 L 312 390.0" fill="none" stroke="#9AA2AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk9AA2AC)"/><rect x="314" y="342" width="232" height="96" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="340" cy="368" r="13" fill="#3A4048" stroke="none" stroke-width="0"/><text x="340" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="430.0" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2" font-weight="600" fill="#14171C" text-anchor="middle">retrieve candidates</text><text x="430.0" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6B7480" text-anchor="middle">search proposes, never promotes</text><path d="M 548 390.0 L 562 390.0" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><rect x="564" y="342" width="232" height="96" rx="8" ry="8" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.8"/><circle cx="590" cy="368" r="13" fill="#2563EB" stroke="none" stroke-width="0"/><text x="590" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="680.0" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2" font-weight="600" fill="#14171C" text-anchor="middle">reuse accepted closure</text><text x="680.0" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6B7480" text-anchor="middle">zero rebuild cost</text><path d="M 798 390.0 L 812 390.0" fill="none" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><rect x="814" y="342" width="232" height="96" rx="8" ry="8" fill="#FCEAEA" stroke="#DC2626" stroke-width="1.8"/><circle cx="840" cy="368" r="13" fill="#DC2626" stroke="none" stroke-width="0"/><text x="840" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="930.0" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2" font-weight="600" fill="#14171C" text-anchor="middle">locate missing frontier</text><text x="930.0" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6B7480" text-anchor="middle">the first unresolved import</text><path d="M 1048 390.0 L 1062 390.0" fill="none" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><rect x="1064" y="342" width="232" height="96" rx="8" ry="8" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.8"/><circle cx="1090" cy="368" r="13" fill="#2563EB" stroke="none" stroke-width="0"/><text x="1090" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1180.0" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2" font-weight="600" fill="#14171C" text-anchor="middle">build only the local delta</text><text x="1180.0" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6B7480" text-anchor="middle">the sole new work</text><path d="M 1298 390.0 L 1312 390.0" fill="none" stroke="#2563EB" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><rect x="1314" y="342" width="232" height="96" rx="8" ry="8" fill="#F4F6F8" stroke="#D4D9E0" stroke-width="1.4"/><circle cx="1340" cy="368" r="13" fill="#3A4048" stroke="none" stroke-width="0"/><text x="1340" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="1430.0" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.2" font-weight="600" fill="#14171C" text-anchor="middle">cache the extended path</text><text x="1430.0" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#6B7480" text-anchor="middle">next query inherits it</text><path d="M 826 454 L 826 470 L 1284 470 L 1284 454" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1055.0" y="492" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#DC2626" text-anchor="middle">the only part this query pays for</text><text x="64" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9AA2AC" text-anchor="start" letter-spacing="1.3">WHEN AN UPSTREAM CONTRACT CHANGES</text><path d="M 148.3354292083394 610.2740166568614 L 266.7443192866599 582.4131013443154" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><path d="M 148.3354292083394 621.7259833431386 L 266.7443192866599 649.5868986556846" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><path d="M 319.0 576.0 L 436.0 576.0" fill="none" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mkDC2626)"/><path d="M 319.0 656.0 L 436.0 656.0" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><path d="M 488.3354292083394 581.7259833431386 L 606.7443192866599 609.5868986556846" fill="none" stroke="#DC2626" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mkDC2626)"/><path d="M 488.3354292083394 650.2740166568614 L 606.7443192866599 622.4131013443154" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk2563EB)"/><circle cx="124" cy="616" r="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0"/><text x="124" y="621" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3A4048" text-anchor="middle">root</text><circle cx="294" cy="576" r="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0"/><text x="294" y="581" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3A4048" text-anchor="middle">A</text><circle cx="294" cy="656" r="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0"/><text x="294" y="661" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3A4048" text-anchor="middle">B</text><circle cx="464" cy="576" r="22" fill="#FCEAEA" stroke="#DC2626" stroke-width="2.0"/><text x="464" y="581" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="middle">C</text><circle cx="464" cy="656" r="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.0"/><text x="464" y="661" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3A4048" text-anchor="middle">D</text><circle cx="634" cy="616" r="22" fill="#FCEAEA" stroke="#DC2626" stroke-width="2.0"/><text x="634" y="621" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="middle">target</text><text x="124" y="664" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#6B7480" text-anchor="middle">version bump</text><rect x="724" y="560" width="892" height="116" rx="8" ry="8" fill="#F4F6F8" stroke="none" stroke-width="0"/><circle cx="750" cy="590" r="6" fill="#DC2626" stroke="none" stroke-width="0"/><text x="768" y="595" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#14171C" text-anchor="start">invalidated — must be rechecked</text><circle cx="750" cy="622" r="6" fill="#2563EB" stroke="none" stroke-width="0"/><text x="768" y="627" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#14171C" text-anchor="start">untouched — stays accepted, no rebuild</text><text x="750" y="656" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6B7480" text-anchor="start">Invalidation follows the dependency edges, not the calendar.</text><text x="1616" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#9AA2AC" text-anchor="end">AgtXIv v0.4  ·  §2.4 search, registry and incremental build  ·  §2.5 QueryResolution cache</text></svg>