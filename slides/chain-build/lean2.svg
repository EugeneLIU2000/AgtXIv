<svg class="pipe-svg" data-cum="0" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lean accepts or rejects; the only escape hatch is sorry, and this repository contains none.">
<defs><marker id="lnbah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="lnbaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <text x="150.0" y="167.0" text-anchor="start" font-size="44" fill="#1A1A16" class="pp-t">It compiles, or it does not. There is no third answer.</text>
    <rect x="150.0" y="250.0" width="760.0" height="230.0" fill="none" stroke="#1A1A16" stroke-width="3.4"/>
    <text x="186.0" y="314.6" text-anchor="start" font-size="34" fill="#1A1A16" class="pp-t">accepted</text>
    <text x="186.0" y="366.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">each step re-checked by a kernel of a few thousand lines</text>
    <text x="186.0" y="402.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">that does not know who wrote it, or how tired it is</text>
    <rect x="1010.0" y="250.0" width="760.0" height="230.0" fill="none" stroke="#8A8A80" stroke-width="1.8"/>
    <text x="1046.0" y="314.6" text-anchor="start" font-size="34" fill="#8A8A80" class="pp-t">rejected</text>
    <text x="1046.0" y="368.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">and it names the step it would not take —</text>
    <text x="1046.0" y="406.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">which is a research to-do list, not a failure</text>
    <line x1="150.0" y1="548.0" x2="1770.0" y2="548.0" stroke="#8A8A80" stroke-width="1.4"/>
    <text x="150.0" y="613.2" text-anchor="start" font-size="30" fill="#1A1A16" class="pp-t">There is exactly one way to cheat, and it is a keyword:</text>
    <text x="186.0" y="677.6" text-anchor="start" font-size="40" fill="#1A1A16" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" class="pp-t">sorry</text>
    <text x="420.0" y="672.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">— accept this claim without a proof. It compiles. It is also recorded, forever, in the file.</text>
    <text x="150.0" y="751.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">Anybody can write it, and it compiles. The difference from prose is that it is written down</text>
    <text x="150.0" y="789.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">— it sits in the file, and anybody who looks can find every one of them.</text>
  </g>
</svg>