<svg class="pipe-svg" data-cum="0" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three open questions: whether more compute and more intelligence is a golden age for theoretical research, and whether that is the same thing as a golden age for theoretical researchers.">
<defs><marker id="dscah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="dscaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <text x="150.0" y="211.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">Three questions I do not have answers to</text>
    <text x="150.0" y="299.7" text-anchor="start" font-size="52" fill="#1A1A16" class="pp-t">A golden age for theoretical research.</text>
    <text x="150.0" y="373.7" text-anchor="start" font-size="52" fill="#1A1A16" class="pp-t">But for theoretical researchers?</text>
    <line x1="150.0" y1="450.0" x2="1260.0" y2="450.0" stroke="#8A8A80" stroke-width="1.4"/>
    <text x="150.0" y="521.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">1</text>
    <text x="210.0" y="521.8" text-anchor="start" font-size="26" fill="#1A1A16" class="pp-t">Does more compute and more intelligence excite you — or frustrate you?</text>
    <text x="150.0" y="589.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">2</text>
    <text x="210.0" y="589.8" text-anchor="start" font-size="26" fill="#1A1A16" class="pp-t">If a machine can produce the result, which part did you want to do?</text>
    <text x="150.0" y="657.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">3</text>
    <text x="210.0" y="657.8" text-anchor="start" font-size="26" fill="#1A1A16" class="pp-t">What would have to be checked before you would build on it?</text>
    <circle cx="1480.0" cy="640.0" r="88.0" fill="#fff" stroke="#1A1A16" stroke-width="3.0"/>
    <circle cx="1443.0" cy="640.0" r="8.8" fill="#1A1A16" stroke="#1A1A16" stroke-width="1.0"/>
    <circle cx="1480.0" cy="640.0" r="8.8" fill="#1A1A16" stroke="#1A1A16" stroke-width="1.0"/>
    <circle cx="1517.0" cy="640.0" r="8.8" fill="#1A1A16" stroke="#1A1A16" stroke-width="1.0"/>
    <circle cx="1640.0" cy="720.0" r="64.0" fill="#fff" stroke="#8A8A80" stroke-width="2.2"/>
    <circle cx="1613.1" cy="720.0" r="6.4" fill="#8A8A80" stroke="#8A8A80" stroke-width="1.0"/>
    <circle cx="1640.0" cy="720.0" r="6.4" fill="#8A8A80" stroke="#8A8A80" stroke-width="1.0"/>
    <circle cx="1666.9" cy="720.0" r="6.4" fill="#8A8A80" stroke="#8A8A80" stroke-width="1.0"/>
    <line x1="1420.0" y1="712.0" x2="1386.0" y2="772.0" stroke="#1A1A16" stroke-width="3.0"/>
    <line x1="1386.0" y1="772.0" x2="1456.0" y2="736.0" stroke="#1A1A16" stroke-width="3.0"/>
    <text x="150.0" y="828.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">yingjian@lorentz.leidenuniv.nl</text>
    <text x="150.0" y="866.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">the deck, the records and the logs are all in the repository</text>
  </g>
</svg>