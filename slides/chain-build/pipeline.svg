<svg class="pipe-svg" data-cum="1" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The pipeline in five boxes: a frozen paper, one record per statement, the records pointing at each other, one result and what it rests on, and a checker.">
<defs><marker id="pipeah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="pipeaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <rect x="70.0" y="385.0" width="300.0" height="230.0" fill="none" stroke="#1A1A16" stroke-width="2.0"/>
    <text x="94.0" y="436.2" text-anchor="start" font-size="30" fill="#1A1A16" class="pp-t">a paper</text>
    <text x="94.0" y="512.6" text-anchor="start" font-size="21" fill="#8A8A80" class="pp-t">frozen.</text>
    <text x="94.0" y="542.6" text-anchor="start" font-size="21" fill="#8A8A80" class="pp-t">every byte fixed,</text>
    <text x="94.0" y="572.6" text-anchor="start" font-size="21" fill="#8A8A80" class="pp-t">so pointers hold.</text>
  </g>
  <g class="pp-g" data-step="1">
