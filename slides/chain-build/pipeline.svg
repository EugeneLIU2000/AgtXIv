    <rect x="1180.0" y="385.0" width="300.0" height="230.0" fill="none" stroke="#1A1A16" stroke-width="2.0"/>
    <text x="1204.0" y="436.2" text-anchor="start" font-size="30" fill="#1A1A16" class="pp-t">core claims</text>
    <text x="1204.0" y="474.2" text-anchor="start" font-size="30" fill="#1A1A16" class="pp-t">+ dependencies</text>
