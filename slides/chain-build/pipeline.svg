    <rect x="1250.0" y="725.0" width="265.0" height="150.0" fill="none" stroke="#1A1A16" stroke-width="2.0"/>
    <text x="1272.0" y="778.2" text-anchor="start" font-size="30" fill="#1A1A16" class="pp-t">it holds</text>
    <text x="1272.0" y="819.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">every step</text>
    <text x="1272.0" y="847.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">was accepted</text>
    <rect x="1565.0" y="725.0" width="285.0" height="150.0" fill="none" stroke="#1A1A16" stroke-width="3.6"/>
    <text x="1587.0" y="778.2" text-anchor="start" font-size="30" fill="#1A1A16" font-weight="700" class="pp-t">it does not</text>
    <text x="1587.0" y="819.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">and it names</text>
    <text x="1587.0" y="847.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">what is missing</text>
    <line x1="1707.5" y1="875.0" x2="1707.5" y2="958.0" stroke="#1A1A16" stroke-width="2.0"/>
    <line x1="1707.5" y1="958.0" x2="590.0" y2="958.0" stroke="#1A1A16" stroke-width="2.0"/>
    <line x1="590.0" y1="958.0" x2="590.0" y2="629.0" stroke="#1A1A16" stroke-width="2.0" marker-end="url(#pipeah)"/>
    <text x="616.0" y="940.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">what is missing goes back in</text>
  </g>
</svg>