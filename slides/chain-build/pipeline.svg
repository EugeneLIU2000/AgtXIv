  <g class="pp-g" data-step="5">
    <rect x="1550.0" y="385.0" width="300.0" height="230.0" fill="none" stroke="#1A1A16" stroke-width="2.0"/>
    <text x="1574.0" y="436.2" text-anchor="start" font-size="30" fill="#1A1A16" class="pp-t">auto-</text>
    <text x="1574.0" y="474.2" text-anchor="start" font-size="30" fill="#1A1A16" class="pp-t">formalization</text>
    <text x="1574.0" y="512.6" text-anchor="start" font-size="21" fill="#8A8A80" class="pp-t">a kernel does not</text>
    <text x="1574.0" y="542.6" text-anchor="start" font-size="21" fill="#8A8A80" class="pp-t">negotiate, and it</text>
    <text x="1574.0" y="572.6" text-anchor="start" font-size="21" fill="#8A8A80" class="pp-t">does not tire.</text>
    <line x1="1494.0" y1="500.0" x2="1536.0" y2="500.0" stroke="#1A1A16" stroke-width="2.0" marker-end="url(#pipeah)"/>
