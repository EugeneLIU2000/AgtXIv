    <text x="464.0" y="474.2" text-anchor="start" font-size="30" fill="#1A1A16" class="pp-t">the claims</text>
    <line x1="464.0" y1="512.0" x2="477.0" y2="512.0" stroke="#8A8A80" stroke-width="1.6"/>
    <text x="486.0" y="518.6" text-anchor="start" font-size="21" fill="#8A8A80" class="pp-t">what it says</text>
    <line x1="464.0" y1="542.0" x2="477.0" y2="542.0" stroke="#8A8A80" stroke-width="1.6"/>
    <text x="486.0" y="548.6" text-anchor="start" font-size="21" fill="#8A8A80" class="pp-t">where it came from</text>
    <line x1="464.0" y1="572.0" x2="477.0" y2="572.0" stroke="#8A8A80" stroke-width="1.6"/>
    <text x="486.0" y="578.6" text-anchor="start" font-size="21" fill="#8A8A80" class="pp-t">a fingerprint</text>
    <line x1="384.0" y1="500.0" x2="426.0" y2="500.0" stroke="#1A1A16" stroke-width="2.0" marker-end="url(#pipeah)"/>
  </g>
