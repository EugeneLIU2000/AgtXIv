    <circle cx="904.0" cy="510.0" r="8.0" fill="#fff" stroke="#1A1A16" stroke-width="2.1"/>
    <line x1="754.0" y1="500.0" x2="796.0" y2="500.0" stroke="#1A1A16" stroke-width="2.0" marker-end="url(#pipeah)"/>
  </g>
  <g class="pp-g" data-step="3">
    <rect x="810.0" y="104.0" width="300.0" height="160.0" fill="none" stroke="#8C4A2F" stroke-width="2.0" stroke-dasharray="9 7"/>
    <text x="834.0" y="149.2" text-anchor="start" font-size="30" fill="#8C4A2F" class="pp-t">outside</text>
    <text x="834.0" y="185.2" text-anchor="start" font-size="30" fill="#8C4A2F" class="pp-t">dependency</text>
    <text x="834.0" y="225.6" text-anchor="start" font-size="21" fill="#8C4A2F" class="pp-t">nobody has fetched it</text>
    <line x1="960.0" y1="377.0" x2="960.0" y2="278.0" stroke="#8C4A2F" stroke-width="2.0" stroke-dasharray="9 7" marker-end="url(#pipeaw)"/>
  </g>
