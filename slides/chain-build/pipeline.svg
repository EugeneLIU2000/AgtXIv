  <g class="pp-g" data-step="6">
    <line x1="1700.0" y1="615.0" x2="1700.0" y2="676.0" stroke="#1A1A16" stroke-width="2.0"/>
    <line x1="1382.5" y1="676.0" x2="1707.5" y2="676.0" stroke="#1A1A16" stroke-width="2.0"/>
