<svg class="pipe-svg" data-cum="0" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A request can be ignored and the transcript looks the same either way; only a constraint can make an answer impossible to express.">
<defs><marker id="hngah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="hngaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <text x="150.0" y="188.6" text-anchor="start" font-size="46" fill="#1A1A16" class="pp-t">A request can be ignored.  A constraint cannot.</text>
    <rect x="150.0" y="270.0" width="760.0" height="330.0" fill="none" stroke="#8A8A80" stroke-width="1.8"/>
    <text x="186.0" y="321.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">REQUESTS</text>
    <text x="186.0" y="380.6" text-anchor="start" font-size="34" fill="#8A8A80" class="pp-t">the prompt</text>
    <text x="186.0" y="434.6" text-anchor="start" font-size="34" fill="#8A8A80" class="pp-t">the skill</text>
    <text x="186.0" y="488.6" text-anchor="start" font-size="34" fill="#8A8A80" class="pp-t">the tool call</text>
    <text x="186.0" y="546.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">can be ignored — and the transcript</text>
    <text x="186.0" y="576.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">looks exactly the same either way</text>
    <rect x="1010.0" y="270.0" width="760.0" height="330.0" fill="none" stroke="#1A1A16" stroke-width="3.6"/>
    <text x="1046.0" y="321.8" text-anchor="start" font-size="26" fill="#1A1A16" class="pp-t">CONSTRAINT</text>
    <text x="1046.0" y="380.6" text-anchor="start" font-size="34" fill="#1A1A16" class="pp-t">the schema</text>
    <text x="1046.0" y="546.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">a record that does not conform is not</text>
    <text x="1046.0" y="576.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">repaired, and not accepted with a warning</text>
    <line x1="1046.0" y1="470.0" x2="1400.0" y2="470.0" stroke="#1A1A16" stroke-width="2.4" marker-end="url(#hngah)"/>
    <text x="1420.0" y="477.8" text-anchor="start" font-size="26" fill="#1A1A16" class="pp-t">REFUSED</text>
    <line x1="150.0" y1="676.0" x2="1770.0" y2="676.0" stroke="#8A8A80" stroke-width="1.4"/>
    <text x="150.0" y="744.6" text-anchor="start" font-size="34" fill="#1A1A16" class="pp-t">A paper’s claims are requests too.</text>
    <text x="150.0" y="811.2" text-anchor="start" font-size="30" fill="#8A8A80" class="pp-t">The rest of this talk is an attempt to make them refusable:</text>
    <text x="150.0" y="853.2" text-anchor="start" font-size="30" fill="#8A8A80" class="pp-t">one paper, broken into claims that each carry what they rest on.</text>
  </g>
</svg>