<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schema v0.4 Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<style>
:root{--paper:#fff;--ink:#1A1A16;--light:#8A8A80;--open:#8C4A2F;--junc:#1F6F78;--stage:#DEDEDA;
--hueB:#2a78d6;--hueE:#1baf7a;--hueD:#4a3aa7;
--f-mono:Calibri,Carlito,sans-serif;--f-body:Calibri,Carlito,sans-serif;
--f-code:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--stage)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage)}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--paper)}
#frame{position:absolute;left:0;top:0;width:1920px;height:1080px;font-family:var(--f-body)}
#frame text{font-family:var(--f-body)}
#frame .code{font-family:var(--f-code)}
.hit{cursor:pointer}
.hit:hover .hl{stroke-width:3.4}
.hit.sel .hl{stroke-width:4.2}
.fade{opacity:.18;transition:opacity .35s var(--ease)}
/* inspector: the chain-build deck's panel */
.insp{position:absolute;right:40px;top:40px;width:680px;max-height:980px;overflow:auto;background:var(--paper);
border:1px solid var(--ink);padding:26px 30px;display:none;font-family:var(--f-mono);z-index:20;box-shadow:0 2px 0 rgba(26,26,22,.08)}
.insp.on{display:block}
.insp h3{font-size:24px;font-weight:400;letter-spacing:-.01em;color:var(--ink);margin-bottom:4px;word-break:break-word;padding-right:48px}
.insp .sub{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--light);margin-bottom:18px}
.insp .contract{font-family:var(--f-body);font-size:18px;line-height:1.5;color:var(--ink);border-top:1px solid var(--ink);
border-bottom:1px solid var(--ink);padding:16px 0;margin:16px 0}
.insp dl{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;font-size:16px;line-height:1.45}
.insp dt{color:var(--light);text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;padding-top:3px}
.insp dd{color:var(--ink);word-break:break-word}
.insp code{font-family:var(--f-code);font-size:13.5px;background:#F4F4F1;padding:0 4px}
.insp .warm{color:var(--open)}
.insp .close{position:absolute;right:22px;top:20px;font-size:15px;color:var(--light);cursor:pointer;letter-spacing:.1em}
.insp .lab{display:inline-block;font-size:11px;letter-spacing:.12em;border:1px solid var(--light);color:var(--light);padding:0 5px;margin-left:6px;vertical-align:1px}
.hint{position:absolute;left:58px;bottom:66px;font-family:var(--f-mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--light);opacity:.8}
.pageno{position:absolute;left:58px;bottom:34px;font-family:var(--f-mono);font-size:17px;color:var(--light);opacity:.8;cursor:pointer}
.actline{position:absolute;right:58px;top:48px;font-family:var(--f-mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--light)}
/* widgets drawn in HTML on top of the frame */
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay .w{position:absolute;pointer-events:auto;font-family:var(--f-body);color:var(--ink)}
.calc label{display:grid;grid-template-columns:330px 150px;align-items:center;font-size:20px;margin:7px 0}
.calc input{font-family:var(--f-body);font-size:20px;width:140px;padding:3px 8px;border:1px solid var(--ink);background:#fff}
.calc .out{font-size:21px;line-height:1.55;margin-top:14px;border-top:1px solid var(--ink);padding-top:12px}
.calc .big{font-size:34px}
.calc .verdict{letter-spacing:.14em;text-transform:uppercase;font-size:20px}
.toggle{display:flex;gap:0}
.toggle button{font-family:var(--f-body);font-size:19px;padding:7px 16px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;margin-right:-1px}
.toggle button.on{background:var(--ink);color:#fff}
.index{position:absolute;left:58px;bottom:100px;width:760px;max-height:880px;overflow:auto;background:#fff;border:1px solid var(--ink);
padding:18px 24px;display:none;z-index:30;font-family:var(--f-body)}
.index.on{display:block}
.index div{font-size:18px;padding:3px 0;cursor:pointer}
.index div:hover{text-decoration:underline}
.index .a{font-size:13px;letter-spacing:.14em;color:var(--light);text-transform:uppercase;margin-top:10px;cursor:default;text-decoration:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="deck-viewport"><main class="deck-stage" id="stage">
  <svg id="frame" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schema v0.4 framework frame"></svg>
  <div id="overlay"></div>
  <div class="insp" id="insp"><span class="close" id="ix">ESC</span>
    <h3 id="ih"></h3><div class="sub" id="isub"></div><div class="contract" id="ic"></div><dl id="idl"></dl></div>
  <div class="hint" id="hint">click a box, node or ⊕ for its record · ← → to move · i for the index</div>
  <div class="actline" id="act"></div>
  <div class="pageno" id="pg" title="index"></div>
  <div class="index" id="index"></div>
</main></div>
<script>
"use strict";
/* Schema v0.4 framework deck. Every frame is drawn from the data below; every clickable mark names a record in REC.
   Numbers carry their label: MEASURED (run artifacts), OFFICIAL (a provider's dated page), ESTIMATED, CITED.
   Source of truth: docs/superpowers/specs/2026-09-25-schema-v04-design.md and schema v0.4/ (host, schemas, tests). */
const INK="#1A1A16", LIGHT="#8A8A80", OPEN="#8C4A2F", JUNC="#1F6F78", HUE={A:INK,B:"#2a78d6",E:"#1baf7a",D:"#4a3aa7"};
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("frame"), overlay=document.getElementById("overlay");
function E(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)if(attrs[k]!==undefined&&attrs[k]!==null)e.setAttribute(k,attrs[k]);
  if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e}
function defs(){const d=E("defs",{});
  for(const [id,c] of [["ah",INK],["aw",OPEN],["al",LIGHT],["aj",JUNC]]){const m=E("marker",{id,viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto-start-reverse"},d);
    E("path",{d:"M 0 0 L 10 5 L 0 10 z",fill:c},m)}}
function T(g,x,y,s,o={}){return E("text",{x,y,"font-size":o.size||20,fill:o.fill||INK,"text-anchor":o.anchor||"start","font-weight":o.bold?700:null,
  "letter-spacing":o.spacing||null,class:o.code?"code":null,"font-style":o.italic?"italic":null},g,s)}
function title(f){const g=E("g",{});T(g,80,98,f.title,{size:46,bold:true});if(f.sub)T(g,80,140,f.sub,{size:23,fill:LIGHT});return g}
function hitGroup(id,parent){const g=E("g",{class:id?"hit":null,"data-id":id||null},parent||svg);return g}
/* a box: title lines (ink, 25px) then grey lines with dash bullets (18px) */
function box(o){const g=hitGroup(o.id);const c=o.tone==="open"?OPEN:(o.tone==="junc"?JUNC:INK);
  E("rect",{x:o.x,y:o.y,width:o.w,height:o.h,fill:o.fill||"#fff",stroke:c,"stroke-width":2,"stroke-dasharray":o.dash?"9 7":null,class:"hl"},g);
  let y=o.y+(o.pad||38);const ts=o.ts||25;
  for(const t of [].concat(o.title||[])){T(g,o.x+20,y,t,{size:ts,fill:c,bold:o.bold});y+=ts+6}
  if(o.tag)T(g,o.x+o.w-14,o.y+24,o.tag,{size:14,fill:LIGHT,anchor:"end",spacing:"0.12em"});
  y+=4;for(const l of o.lines||[]){E("line",{x1:o.x+20,y1:y-6,x2:o.x+31,y2:y-6,stroke:LIGHT,"stroke-width":1.5},g);T(g,o.x+38,y,l,{size:o.ls||18,fill:LIGHT,code:o.code});y+=(o.ls||18)+7}
  return g}
function diamond(o){const g=hitGroup(o.id);const {x,y,w,h}=o;const c=o.tone==="open"?OPEN:INK;
  E("path",{d:`M ${x+w/2} ${y} L ${x+w} ${y+h/2} L ${x+w/2} ${y+h} L ${x} ${y+h/2} Z`,fill:"#fff",stroke:c,"stroke-width":2,class:"hl"},g);
  let ty=y+h/2-(o.lines?10:-8);T(g,x+w/2,ty,o.title,{size:24,anchor:"middle",bold:true,fill:c});
  (o.lines||[]).forEach((l,i)=>T(g,x+w/2,ty+26+i*21,l,{size:17,anchor:"middle",fill:LIGHT}));return g}
function arrow(pts,o={}){const c=o.tone==="open"?OPEN:(o.tone==="light"?LIGHT:(o.tone==="junc"?JUNC:INK));
  const m=o.tone==="open"?"aw":(o.tone==="light"?"al":(o.tone==="junc"?"aj":"ah"));
  const p=E("polyline",{points:pts.map(q=>q.join(",")).join(" "),fill:"none",stroke:c,"stroke-width":o.w||2,"stroke-dasharray":o.dash?"9 7":null,
    "marker-end":o.nohead?null:`url(#${m})`},o.parent||svg);
  if(o.label){const [a,b]=o.at||pts[Math.floor(pts.length/2)-(pts.length%2?0:1)];T(o.parent||svg,a+(o.dx||8),b+(o.dy||-8),o.label,{size:16,fill:c,spacing:"0.08em"})}return p}
function rule(x1,y1,x2,y2,o={}){return E("line",{x1,y1,x2,y2,stroke:o.c||INK,"stroke-width":o.w||1,opacity:o.op||null,"stroke-dasharray":o.dash||null},o.parent||svg)}
/* graph marks: shape = kind, colour = source paper, dashed warm = open placeholder */
function shape(g,kind,x,y,r,c,o={}){const a={fill:o.fill||"#fff",stroke:c,"stroke-width":o.sw||2.4,class:"hl","stroke-dasharray":o.dash?"6 4":null};
  if(kind==="definition")return E("rect",{...a,x:x-r,y:y-r,width:2*r,height:2*r},g);
  if(kind==="lemma")return E("path",{...a,d:`M ${x} ${y-r*1.15} L ${x+r*1.1} ${y+r*.8} L ${x-r*1.1} ${y+r*.8} Z`},g);
  if(kind==="theorem")return E("path",{...a,d:`M ${x} ${y-r*1.25} L ${x+r*1.25} ${y} L ${x} ${y+r*1.25} L ${x-r*1.25} ${y} Z`},g);
  if(kind==="work"){const p=[];for(let k=0;k<6;k++){const t=Math.PI/6+k*Math.PI/3;p.push(`${x+r*1.1*Math.cos(t)},${y+r*1.1*Math.sin(t)}`)}return E("polygon",{...a,points:p.join(" ")},g)}
  if(kind==="request")return E("circle",{...a,cx:x,cy:y,r,stroke:OPEN,"stroke-dasharray":"6 4"},g);
  if(kind==="unresolved")return E("rect",{...a,x:x-r,y:y-r,width:2*r,height:2*r,stroke:OPEN,"stroke-dasharray":"6 4"},g);
  return E("circle",{...a,cx:x,cy:y,r},g)}
function gnode(o){const g=hitGroup(o.id);g.classList.add("gn");shape(g,o.kind,o.x,o.y,o.r||19,HUE[o.paper]||INK,o);
  if(o.label)T(g,o.x+(o.lx||30),o.y+(o.ly||7),o.label,{size:o.ls||20,fill:o.lc||INK});return g}
/* a junction: ⊕ at (x,y), curves from premises, a stem with an arrow to the conclusion */
function junction(o){const g=hitGroup(o.id);g.classList.add("gj");const c=o.c||INK;
  for(const [px,py] of o.from){const my=(py+o.y)/2;E("path",{d:`M ${px} ${py} C ${px} ${my}, ${o.x} ${my}, ${o.x} ${o.y+11}`,fill:"none",stroke:c,"stroke-width":1.6,opacity:.55,class:"hl","stroke-dasharray":o.dash?"6 4":null},g)}
  E("line",{x1:o.x,y1:o.y-11,x2:o.to[0],y2:o.to[1],stroke:c,"stroke-width":2.2,"marker-end":`url(#${c===OPEN?"aw":c===JUNC?"aj":"ah"})`},g);
  E("circle",{cx:o.x,cy:o.y,r:11,fill:"#fff",stroke:c,"stroke-width":2,class:"hl"},g);
  E("path",{d:`M ${o.x-6} ${o.y} H ${o.x+6} M ${o.x} ${o.y-6} V ${o.y+6}`,stroke:c,"stroke-width":1.8,fill:"none"},g);
  if(o.label)T(g,o.x+16,o.y+6,o.label,{size:15,fill:LIGHT,spacing:"0.06em"});return g}
function legend(x,y,items){let cx=x;for(const [kind,c,txt,o] of items){const g=E("g",{});shape(g,kind,cx+10,y-6,9,c,{sw:2,...(o||{})});T(g,cx+26,y,txt,{size:17,fill:INK});cx+=52+txt.length*8.2}}
function small(x,y,s,o={}){return T(o.parent||svg,x,y,s,{size:o.size||16,fill:o.fill||LIGHT,spacing:o.spacing||"0.12em",anchor:o.anchor,code:o.code})}
function para(x,y,lines,o={}){lines.forEach((l,i)=>T(o.parent||svg,x,y+i*(o.lh||30),l,{size:o.size||21,fill:o.fill||INK,code:o.code}));return y+lines.length*(o.lh||30)}
</script>
<script>
"use strict";
/* ---- records shown by the inspector: {t: title, s: sub, c: plain sentence, r: [[label, value(html)], ...]} ---- */
const c=x=>`<code>${x}</code>`, L=x=>`<span class="lab">${x}</span>`;
const REC={
/* overview */
"S0":{t:"S0 · Corpus manifest",s:"host · corpus.freeze_corpus_manifest",c:"Everything the run may not change is frozen first and named by its own digest: field, frame, eligibility program, the one extraction policy, the gate rules, the analysis template and the budget ceiling.",
 r:[["contract",c("CorpusManifest")+" (closed; id = "+c("corpus:&lt;sha256&gt;")+")"],["coverage",c("EQUAL_FULL")+" — the only value: every accepted paper gets the same S6"],
 ["extraction",c("{operation: paper.extract_focus | paper.extract_local, method_version, focus_bytes | prose_bytes}")],
 ["gates",c("P_MINUS_1")+" and "+c("P0")+" thresholds, pre-registered before anything is measured"],["template",c("primary_analysis_policy")+" with status PRIMARY and "+c("admission_gate = null")],
 ["budget",c("budget_ceiling {unit, value, pricing_profile_sha256}")+" — a money ceiling names the price file it is in"],["refuses","host fields supplied by the caller; any later edit ("+c("CORPUS_ID_IS_NOT_THE_MANIFEST_DIGEST")+")"]]},
"S1":{t:"S1 · Acquire and admit",s:"host · corpus.sample_record / expansion_record / discovery_record / includes_delta",c:"Candidates are examined in a seeded hash order until the target is accepted; every examined id gets exactly one outcome, and accepted papers are never replaced.",
 r:[["order",c("order_key = sha256(seed ‖ 0x00 ‖ arxiv_base_id)")],["outcomes",c("ACCEPTED")+", "+c("INELIGIBLE(reason)")+", "+c("UNDETERMINED(class)")+" — classes incl. "+c("ID_NOT_FOUND")],
 ["rounds","round 0 "+c("SAMPLE")+" (in P); rounds ≥ 1 "+c("EXPANSION")+" or "+c("DISCOVERY")+" (never in P)"],["delta","S1 "+c("HOST_RULE")+" delta: the "+c("PaperVersion")+" row of every accepted paper + "+c("INCLUDES {admission, round, sampling_record_id}")],
 ["rate","one shared arXiv rate token, ≥ 3 s between requests (v0.3 fetch limits)"],["status",'<span class="warm">not run: network access is not authorized</span>']]},
"S2":{t:"S2 · Parse",s:"host · v0.3 ingest.extract_paper",c:"The frozen source becomes occurrences (theorem-like and definition environments, display equations, equation bundles, prose paragraphs), labels, anchors and bibliography, each with byte spans and digests.",
 r:[["reuses","v0.3 "+c("ingest.extract_paper")+", "+c("bibtex.parse_bibtex")+" (unchanged)"],["adds",c("\\cite")+" optional argument ("+c("locator_text")+"), proof-header ownership"],["identity",c("occ:&lt;sha256 of {pv, path, byte_start, byte_end, span_sha256}&gt;")]]},
"S3":{t:"S3 · Deterministic anchor graph",s:"host · anchors.build_anchor_delta",c:"Label references that already sit in the TeX become typed legs without a model: a \\ref inside an owned proof is a PROOF leg, inside a statement a STATEMENT leg.",
 r:[["method",c("DETERMINISTIC_ANCHOR")+" / "+c("anchors-0.4.0")],["premises","environment claims; "+c("\\eqref")+" and prose targets → "+c("UNRESOLVED_OCCURRENCE")],["\\cite","in an owned proof → "+c("EXTERNAL_REQUEST")+"; in a theorem header → "+c("RESTATES_RESULT_OF")+"; elsewhere → "+c("MENTIONS")],
 ["measured","4 retained papers: 953 anchors, 324 resolve to an occurrence (224 equations, 69 environments); 56 \\ref + 27 \\cite inside owned proofs "+L("MEASURED")],["yield",c("measurements.deterministic_yield")+" per paper"]]},
"S4":{t:"S4 · Works",s:"host · works.py",c:"Bibliography entries resolve to Work nodes by explicit identifiers only (arXiv id, DOI); host-rule SAME_WORK joins an arXiv work and its DOI.",
 r:[["rows",c("Work")+", "+c("RESOLVES_TO {method, basis}")+", "+c("SAME_WORK {basis}")],["identity",c("ARXIV_BASE | DOI | OPENALEX | BIB_DIGEST")],["adapters","Crossref, OpenAlex snapshot: only with network authorization "+'<span class="warm">(not implemented)</span>']]},
"P-1":{t:"S5 · P-1 gate (no model)",s:"host · gates.p_minus_1",c:"Before any model is paid, the host measures whether the sample is eligible and whether its papers share cited works; the rule was fixed at S0.",
 r:[["NO_GO","eligible fraction < "+c("min_eligible_fraction")+" or undetermined fraction > "+c("max_undetermined_fraction")],["GO","≥ "+c("min_works")+" works each cited by ≥ "+c("min_citing_papers")+" sample papers"],
 ["GO_WITH_EXPANSION","otherwise: acquire cited works (EXPANSION) or related papers (DISCOVERY) first"],["also measured","in-proof citing counts, in-sample citation share, summed deterministic yield, the eligibility grid"],["record",c("GateDecision {gate: P_MINUS_1, measured, rule, decision, reasons}")]]},
"PILOT":{t:"Pilot S6 + S7",s:"stage 1 · a small random set, both extraction modes",c:"The pilot runs the corpus extraction (and, for comparison, the other mode) on a few hundred papers so that quality, cost and throughput are measured before the full run.",
 r:[["measures","legs to judge; cached-token share; reasoning tokens; validation rate; calls per paper; achieved parallelism"],["modes",c("paper.extract_focus")+" vs "+c("paper.extract_local")+" on the same papers ("+c("LOCAL_VS_WHOLE_RECALL")+")"],["status",'<span class="warm">not run: model calls are not authorized</span>']]},
"S6":{t:"S6 · Extract (every paper, one policy)",s:"light model · paper.extract_focus | paper.extract_local",c:"A model lists each claim of the paper and what it rests on; the host binds every quotation to bytes and refuses anything it cannot bind.",
 r:[["response","v0.3 "+c("CLAIM_RESPONSE_SCHEMA")+" + "+c("CLAIM_REFERENCE_V1")+" (unchanged)"],["legs",c("UNCLASSIFIED")+" / "+c("UNKNOWN")+" (the schema records neither role nor use site)"],["refusal","any rejected claim makes the whole response an issues-only delta — never a guess"],["coverage",c("corpus.coverage_report")+" accounts every accepted paper from the ledger's terminal states: DONE, FAILED, INCOMPLETE, MISSING"],["retry","a response the host checks refuse ("+c("RESPONSE_REJECTED")+") is tried again while attempts remain"]]},
"S7":{t:"S7 · Retrieved matching",s:"decision model · dependency.match_retrieved",c:"For a request to an upstream paper in the corpus, the model sees the citing claim and a few retrieved candidate statements of that paper, not two whole sources.",

"AUTOEVAL":{t:"AUTO_EVAL_V1 · automatic judgement",s:"host · autoeval.py; judges · leg.judge, match.judge",c:"Instead of people labelling legs, a frozen panel of other models judges blinded cards, and decoys measure how often the panel is fooled.",
 r:[["plan",c("EvaluationPlan")+" frozen before any judge call"],["labels",c("UNANIMOUS_VALID_USED")],["output",c("EvaluationReport {label_source: AUTO_PANEL, inputs, precision[], recall[], assumptions[]}")],["humans","optional audit only ("+c("autoeval.human_audit")+")"]]},
"COST":{t:"Cost projection",s:"host · cost.project",c:"The host projects calls, tokens, money and wall-clock time of the manifest's one S6 policy over the planned papers, each parameter labelled with where it came from. It reads the price file itself, can use per-paper plans measured by the prompt builder, and reserves budget for the other stages.",
 r:[["record",c("CostProjection {paper_plans, parameters, totals, wallclock_minutes, wallclock_basis, fits_context, ceiling {projected, other_stages, already_spent}, under_ceiling}")],["prices",c("profiles/pricing-mimo-20260922.json")+" "+L("OFFICIAL")],["10,000 papers","WHOLE_PAPER_FOCUS: $638 real-time, $319 Batch ($2,038 / $1,019 without cache hits) "+L("ESTIMATED")]]},
"P0":{t:"P0 gate",s:"host · gates.p0 → gates.primary_policy",c:"The full run starts only if the corpus extraction version passed the automatic precision bound, recomputed by the gate itself, and a projection built on measured inputs fits the ceiling and the context window.",
 r:[["refuses","an input whose id is not the digest of its content; rows that do not recompute ("+c("autoeval.recheck")+"); rows that miss a stratum"],["GO iff","every "+c("MODEL_EXTRACTION")+" stratum of the corpus "+c("method_version")+" ADMIT ∧ projection over ≥ target_size papers, MEASURED sizes, no ESTIMATED parameter ∧ "+c("under_ceiling")+" ∧ "+c("fits_context")],["admitted","methods whose every counted stratum is ADMIT, plus HUMAN and LIBRARY"],["then",c("primary_policy")+": template ∩ admitted methods, "+c("admission_gate = gate_id")+", new "+c("policy_id")],["note","MODEL_MATCH not admitted → S7 legs stay out of importance counts (a reason, not a stop)"]]},
"FULL":{t:"Full run · EQUAL_FULL",s:"stage 1 · every accepted paper of every round",c:"The same S6 policy runs on every accepted paper — sample, cited and discovered alike — and S7 on every request whose upstream paper is in the corpus.",
 r:[["no ranking","no prioritized arm, no audit arm (withdrawn in Revision 3)"],["accounting",c("coverage_report")+" → "+c("gates.require_equal_coverage")+" before a PRIMARY analysis"],["failed papers","keep their rows and count in every denominator with missing data"]]},

/* ---- driver ---- */
const stage=document.getElementById("stage"),insp=document.getElementById("insp"),hint=document.getElementById("hint"),idx=document.getElementById("index");
function scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`}
scale();addEventListener("resize",scale);
let i=0;
function render(){hideNode();svg.innerHTML="";overlay.innerHTML="";defs();const f=FR[i];if(f.title)title(f);f.draw();if(f.widget)f.widget();
  document.getElementById("act").textContent=f.act;document.getElementById("pg").textContent=(i+1)+" / "+FR.length;
  try{history.replaceState(null,"","#"+(i+1))}catch(e){}}
function go(n){i=Math.max(0,Math.min(n,FR.length-1));render()}
function esc(s){return String(s).replace(/&(?!(lt|gt|amp);)/g,"&amp;")}
function showNode(id){const r=REC[id];if(!r)return;svg.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel"));svg.querySelectorAll(`[data-id="${CSS.escape(id)}"]`).forEach(e=>e.classList.add("sel"));
  document.getElementById("ih").textContent=r.t;document.getElementById("isub").innerHTML=r.s||"";document.getElementById("ic").innerHTML=r.c||"";
  document.getElementById("idl").innerHTML=(r.r||[]).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");insp.classList.add("on");hint.style.display="none"}
function hideNode(){insp.classList.remove("on");hint.style.display="";svg.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel"))}
document.getElementById("ix").addEventListener("click",e=>{e.stopPropagation();hideNode()});
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(["ArrowRight"," ","PageDown"].includes(e.key)){e.preventDefault();go(i+1)}
  if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(i-1)}
  if(e.key==="Home")go(0);if(e.key==="End")go(FR.length-1);if(e.key==="Escape"){hideNode();idx.classList.remove("on")}
  if(e.key==="i"||e.key==="I")toggleIndex()});
function toggleIndex(){if(idx.classList.toggle("on")){let last="",h="";FR.forEach((f,k)=>{if(f.act!==last){h+=`<div class="a">${f.act}</div>`;last=f.act}h+=`<div data-k="${k}">${k+1}. ${f.title||"Title"}</div>`});
  idx.innerHTML=h;idx.querySelectorAll("[data-k]").forEach(d=>d.addEventListener("click",e=>{e.stopPropagation();idx.classList.remove("on");go(+d.dataset.k)}))}}
document.getElementById("pg").addEventListener("click",e=>{e.stopPropagation();toggleIndex()});
addEventListener("click",e=>{
  if(e.target.closest(".insp")||e.target.closest("#overlay .w")||e.target.closest(".index"))return;
  const h=e.target.closest(".hit");if(h){showNode(h.dataset.id);return}
  if(insp.classList.contains("on")){hideNode();return}
  if(idx.classList.contains("on")){idx.classList.remove("on");return}
  go(i+1)});
window.goto=n=>{go(n);return i};
const fromHash=()=>{const n=parseInt((location.hash||"").slice(1),10);return Number.isFinite(n)?n-1:0};
addEventListener("hashchange",()=>{if(fromHash()!==i)go(fromHash())});go(fromHash());
</script>
