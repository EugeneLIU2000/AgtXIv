<svg class="pipe-svg" data-cum="0" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="For later work to use a conclusion it must know what was said, what it rested on and what has been checked; the route is one paper, its claims and dependencies, one theorem’s chain, and where it stops.">
<defs><marker id="rmpah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="rmpaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <text x="150.0" y="173.6" text-anchor="start" font-size="40" fill="#1A1A16" class="pp-t">For later work to use a conclusion, it has to know three things</text>
    <rect x="150.0" y="230.0" width="520.0" height="180.0" fill="none" stroke="#1A1A16" stroke-width="2.8"/>
    <text x="180.0" y="292.9" text-anchor="start" font-size="32" fill="#1A1A16" class="pp-t">what it said</text>
    <text x="180.0" y="348.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">the exact statement, not the abstract</text>
    <rect x="700.0" y="230.0" width="520.0" height="180.0" fill="none" stroke="#1A1A16" stroke-width="2.8"/>
    <text x="730.0" y="292.9" text-anchor="start" font-size="32" fill="#1A1A16" class="pp-t">what it relied on</text>
    <text x="730.0" y="348.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">every claim underneath it, named</text>
    <rect x="1250.0" y="230.0" width="520.0" height="180.0" fill="none" stroke="#1A1A16" stroke-width="2.8"/>
    <text x="1280.0" y="292.9" text-anchor="start" font-size="32" fill="#1A1A16" class="pp-t">what was checked</text>
    <text x="1280.0" y="348.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">and by what — a kernel, or nobody</text>
    <line x1="150.0" y1="500.0" x2="1770.0" y2="500.0" stroke="#8A8A80" stroke-width="1.4"/>
    <rect x="150.0" y="590.0" width="340.0" height="150.0" fill="none" stroke="#8A8A80" stroke-width="1.8"/>
    <text x="172.0" y="640.2" text-anchor="start" font-size="24" fill="#1A1A16" class="pp-t">one paper, frozen</text>
    <text x="172.0" y="680.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">the source, byte for byte</text>
    <line x1="500.0" y1="665.0" x2="540.0" y2="665.0" stroke="#8A8A80" stroke-width="2.0" marker-end="url(#rmpah)"/>
    <rect x="550.0" y="590.0" width="340.0" height="150.0" fill="none" stroke="#8A8A80" stroke-width="1.8"/>
    <text x="572.0" y="640.2" text-anchor="start" font-size="24" fill="#1A1A16" class="pp-t">claims + dependencies</text>
    <text x="572.0" y="680.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">what points at what</text>
    <line x1="900.0" y1="665.0" x2="940.0" y2="665.0" stroke="#8A8A80" stroke-width="2.0" marker-end="url(#rmpah)"/>
    <rect x="950.0" y="590.0" width="340.0" height="150.0" fill="none" stroke="#8A8A80" stroke-width="1.8"/>
    <text x="972.0" y="640.2" text-anchor="start" font-size="24" fill="#1A1A16" class="pp-t">one theorem’s chain</text>
    <text x="972.0" y="680.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">29 claims, 46 links</text>
    <line x1="1300.0" y1="665.0" x2="1340.0" y2="665.0" stroke="#8A8A80" stroke-width="2.0" marker-end="url(#rmpah)"/>
    <rect x="1350.0" y="590.0" width="340.0" height="150.0" fill="none" stroke="#8A8A80" stroke-width="1.8"/>
    <text x="1372.0" y="640.2" text-anchor="start" font-size="24" fill="#1A1A16" class="pp-t">where it stops</text>
    <text x="1372.0" y="680.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">and it does stop</text>
    <text x="150.0" y="821.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">One real paper, one real run. Every number after this frame is read out of the logs, not estimated.</text>
    <text x="150.0" y="865.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">Where nobody measured it, the frame says so.</text>
  </g>
</svg>