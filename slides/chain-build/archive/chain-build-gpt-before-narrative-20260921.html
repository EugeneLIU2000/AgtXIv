/* Frontend Slides viewport base; original deck theme follows. */
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}
/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}
/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}
/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }
    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }
    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}
/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}


:root{--stage-bg:#DEDEDA;--slide-bg:#fff;--paper:#fff;--ink:#1A1A16;--light:#8A8A80;--open:#8C4A2F;--stage:#DEDEDA;

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--stage)}

transform-origin:0 0;background:var(--paper)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

.opensvg.on{visibility:visible;opacity:1;pointer-events:auto}
.chain-svg{width:1920px;height:1040px;overflow:visible}
.ch-guides line{stroke:var(--ink);stroke-width:1;opacity:.085}
.ch-lay{font-family:var(--f-mono);font-size:17px;letter-spacing:.14em;fill:var(--light)}
.ch-grp{opacity:0;transition:opacity .55s var(--ease)}
.ch-grp.on{opacity:1}
.gstem,.gbar,.gleg{stroke:var(--ink);fill:none;stroke-width:1.6;opacity:.42}
.gbar{stroke-width:2.2;opacity:.6}
.gand{font-family:var(--f-mono);font-size:15px;letter-spacing:.08em;fill:var(--light);opacity:.9}
.ch-node{opacity:0;transition:opacity .5s var(--ease)}
.ch-node.on{opacity:1}
.nmark{fill:var(--paper);stroke:var(--ink);stroke-width:2.1}
.nring{fill:none;stroke:var(--ink);stroke-width:2.6;opacity:0}
.is-theorem .nmark{stroke-width:3.2}
.ch-lab{font-family:var(--f-mono);font-size:22px;fill:var(--ink);opacity:0;transition:opacity .5s var(--ease)}
/* what arrived at this step, in ink: stroke weight and a faint ring. Steps 5-7
   add only 3, 2 and 1 marks among 26-29, which is otherwise undetectable in a
   static frame. Luminance, not hue - no colour exception spent. */
.ch-node.is-new .nmark{stroke-width:3.6}
.ch-node.is-new .nring{opacity:.3}
.ch-grp.is-new .gbar,.ch-grp.is-new .gstem,.ch-grp.is-new .gleg{opacity:.9;stroke-width:2.6}
.ch-lab.on{opacity:1}
[data-phase="roots"] .ch-node:not(.is-root){opacity:.14}
/* the dashed ring alone means ROOT; the colour means NOT FROM THIS PAPER,
   which is what warm already means on the opening frames. Six imports warm,
   three of the paper's own definitions ink - the 6/3 split made visible. */
[data-phase="roots"] .is-root .nmark{stroke:var(--ink);stroke-width:3.4}
[data-phase="roots"] .is-root .nring{opacity:1;stroke:var(--ink);stroke-dasharray:6 4}
[data-phase="roots"] .is-root.is-import .nmark{stroke:var(--open)}
[data-phase="roots"] .is-root.is-import .nring{stroke:var(--open)}
[data-phase="roots"] .ch-grp{opacity:.10}
[data-phase="form"] .ch-node:not(.is-form){opacity:.14}
[data-phase="form"] .is-form .nmark{fill:var(--ink);stroke:var(--ink)}
[data-phase="form"] .ch-grp{opacity:.10}
[data-phase="stuck"] .ch-node.is-form{opacity:.14}
/* the dimming already isolates the 15; warm is spent on the two imports that
   CAUSE them, so the frame names a cause instead of only a count */
[data-phase="stuck"] .ch-node:not(.is-form) .nmark{stroke:var(--ink);stroke-width:2.8}
[data-phase="stuck"] .is-theorem .nmark{stroke:var(--ink);stroke-width:4}
[data-phase="stuck"] .ch-node:not(.is-form).is-import .nmark{stroke:var(--open);stroke-width:3.4}
[data-phase="stuck"] .ch-node:not(.is-form).is-import .nring{opacity:1;stroke:var(--open);stroke-dasharray:6 4}
[data-phase="stuck"] .ch-grp{opacity:.10}

/* CLICK INSPECTOR - hidden until a node is clicked, so the frame stays bare */
.ch-node{cursor:pointer}
.ch-node:hover .nmark{stroke-width:4.2}
.insp{position:absolute;right:40px;top:40px;width:660px;max-height:960px;overflow:auto;

.insp .warm{color:var(--open)}

.insp .grp{margin-top:4px}

letter-spacing:.14em;color:var(--light)}

 x="150" y="722.625" xml:space="preserve">  sha256:2b60bef5a0f7dbde1a490eb8a75f11c6c1eca46…</text><text class="k" x="150" y="756.125" xml:space="preserve">semantic_content_hash</text><text class="v" x="150" y="789.625" xml:space="preserve">  sha256:18100a587e866a55b821d4aedbf241d9398ce6b…</text><text class="k" x="150" y="823.125" xml:space="preserve">artifact.artifact_hash</text><text class="v" x="150" y="856.625" xml:space="preserve">  sha256:e6ebebea68b7b292d048e6e97e3614e77f0218b…</text><line class="r" x1="150" y1="896.55" x2="1770" y2="896.55"/><text class="w" x="150" y="926.55" xml:space="preserve">the statement is normalized, not quoted — and relation_to_source</text><text class="w" x="150" y="960.05" xml:space="preserve">says how far it moved</text></svg><svg class="opensvg" id="o1" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1920 1040" xmlns="http://www.w3.org/2000/svg" style="background:#fff"><style>.k{font-family:monospace;font-size:23px;fill:#8A8A80}.v{font-family:monospace;font-size:23px;fill:#1A1A16}.w{font-family:monospace;font-size:23px;fill:#1A1A16;font-weight:700}.r{stroke:#1A1A16;stroke-width:1.2}</style><text class="k" x="150" y="110" xml:space="preserve">lamport.json  ·  the structured proof the model returned</text><text class="v" x="150" y="162.7" xml:space="preserve">  1. Fix a finite index type ι and coefficients x : ι → ℝ satisfying ∑ i, x i</text><text class="v" x="150" y="196.7" xml:space="preserve">     = 1.</text><text class="v" x="150" y="230.7" xml:space="preserve">  2. Apply AgtXIv.RoM.normalized_l1 to x and the normalization hypothesis;</text><text class="v" x="150" y="264.7" xml:space="preserve">     project its first conjunct to obtain 1 ≤ AgtXIv.RoM.l1Cost x.</text><text class="v" x="150" y="298.7" xml:space="preserve">  3. Unfold l1Cost to express the bound as 1 ≤ ∑ i, |x i|.</text><line class="r" x1="150" y1="339.4" x2="1770" y2="339.4"/><text class="k" x="150" y="369.4" xml:space="preserve">alignment_notes</text><text class="v" x="150" y="403.4" xml:space="preserve">  · Fintype represents the finite index type; x has real coefficients and the</text><text class="v" x="150" y="437.4" xml:space="preserve">    hypothesis preserves their sum being one. No nonnegativity or nonempty-</text><text class="v" x="150" y="471.4" xml:space="preserve">    index assumption is added.</text><text class="v" x="150" y="505.4" xml:space="preserve">  · The explicit sum of absolute values represents the source's coefficient</text><text class="v" x="150" y="539.4" xml:space="preserve">    cost. Only the lower-bound conjunct of normalized_l1 is used.</text><text class="v" x="150" y="573.4" xml:space="preserve">  · This statement concerns the coefficient bound alone; it does not assert</text><text class="v" x="150" y="607.4" xml:space="preserve">    primal feasibility or strong duality.</text><text class="k" x="150" y="660.1" xml:space="preserve">remaining_obligations</text><text class="w" x="150" y="694.1" xml:space="preserve">  · Host elaboration of the proposed terms remains pending; no Lean execution</text><text class="w" x="150" y="728.1" xml:space="preserve">    was performed.</text></svg>

<script>
const METER=["ONE RESULT · AND THE SPACE UNDERNEATH IT", "6 LINES OF ANSWER · 7,765 LINES OF GROUND", "54 KERNEL-CHECKED · 46 OF THEM CONDITIONAL", "82 OF 82 MODULES COMPILE · THE ANSWER IS STILL EMPTY", "TOKENS, CALLS AND SECONDS ARE RECORDED · DOLLARS ARE NOT", "THE SAME STATEMENT, TWICE · ONCE WITH ITS INTERMEDIATES", "ONE PAPER · FROZEN", "EVERY STATEMENT · ONE RECORD EACH", "THE RECORDS POINT AT EACH OTHER", "AND SOME POINT OUTSIDE THE PAPER", "ONE RESULT · ONLY WHAT IT RESTS ON", "EVERY REMAINING STEP GOES TO A CHECKER", "IT HOLDS · OR IT NAMES WHAT IS MISSING", "ONE MATH CLAIM  ·  NORMALIZED, HASHED, ANCHORED", "ONE LAMPORT PROOF  ·  3 STEPS  ·  MODEL-WRITTEN, KERNEL-CHECKED", "613 CLAIMS  ·  634 DEPENDENCIES  ·  EVERYTHING EXTRACTED", "240 FROM THE TARGET PAPER  ·  373 EVERYTHING ELSE", "14 OF THE 240 LAND ON A RESULT THE PAPER DECLARES  ·  9 OF 9 HIT", "A DIFFERENT OBJECT  ·  74 CLAIMS, AUTHORED BY HAND", "29 OF 74  ·  THE CLOSURE OF ONE THEOREM", "1 CLAIM", "4 CLAIMS  ·  1 AND-GROUP", "7 CLAIMS  ·  3 GROUPS", "13 CLAIMS  ·  5 GROUPS", "23 CLAIMS  ·  10 GROUPS", "26 CLAIMS  ·  16 GROUPS", "28 CLAIMS  ·  19 GROUPS", "29 CLAIMS  ·  20 GROUPS  ·  DEPENDENCY EXPANSION COMPLETE", "9 ROOTS  ·  NOTHING BELOW THEM", "FORMALIZATION ORDER  ·  14 OF 29", "15 UNREACHABLE  ·  CHAIN_INCOMPLETE"], MAXW=7, NMOT=6, NPIPE=7, NOPEN=7, OPENM=new Set([9, 16, 28, 30]), N=METER.length;
const stage=document.getElementById('stage'), fig=document.getElementById('fig'),
      ow=document.getElementById('ow'), pw=document.getElementById('pw'),
      mw=document.getElementById('mw');
function scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);
 stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
scale(); addEventListener('resize',scale);
let i=0;
function showFig(wrap, active, step){
 if(!wrap) return;
 const svg=wrap.querySelector('svg'), cum=!svg||svg.dataset.cum!=='0';
 wrap.querySelectorAll('.pp-g').forEach(g=>{
   const s=+g.dataset.step;
   g.classList.toggle('on', active && (cum ? s<=step : s===step));
 });
}
function render(){
 document.querySelectorAll('.is-new').forEach(el=>el.classList.remove('is-new'));
 const mot = i < NMOT,
       pipe = !mot && i < NMOT+NPIPE,
       opening = !mot && !pipe && i < NMOT+NPIPE+NOPEN;
 if(mw) mw.classList.toggle('off', !mot);
 pw.classList.toggle('off', !pipe);
 ow.classList.toggle('off', !opening);
 fig.classList.toggle('off', mot||pipe||opening);
 showFig(mw, mot, i);
 showFig(pw, pipe, i-NMOT);
 for(let k=0;k<NOPEN;k++)
   document.getElementById('o'+k).classList.toggle('on', opening && k===i-NMOT-NPIPE);
 if(!mot && !pipe && !opening){
   const j=i-NMOT-NPIPE-NOPEN;
   const phase = j===8?'roots' : j===9?'form' : j===10?'stuck' : 'build';
   fig.dataset.phase=phase;
   const upto = phase==='build' ? j : MAXW;
   document.querySelectorAll('[data-wave]').forEach(el=>{
     const w=parseInt(el.dataset.wave,10);
     el.classList.toggle('on', w<=upto);
     el.classList.toggle('is-new', phase==='build' && j>=2 && w===upto && !el.classList.contains('ch-lab'));
   });
 }
 const m=document.getElementById('m');
 m.textContent=METER[i];
 m.classList.toggle('open', OPENM.has(i));
 document.getElementById('c').textContent=(i+1)+' / '+N;
 hint.style.display = (i>=NMOT+NPIPE+NOPEN && !insp.classList.contains('on')) ? '' : 'none';
 document.getElementById('stage').classList.toggle('graph-only',i>=NMOT+NPIPE+NOPEN);
 refreshSelection();
}
addEventListener('keydown',e=>{
 if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();i=Math.min(i+1,N-1);render()}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();i=Math.max(i-1,0);render()}
 if(e.key==='Home'){i=0;render()} if(e.key==='End'){i=N-1;render()}
});
addEventListener('click',(e)=>{
 if(e.target.closest('.dependency-group')||e.target.closest('#graph-side')||e.target.closest('.ch-node')||e.target.closest('.insp')) return;   // inspect, don't advance
 hideNode(); i=Math.min(i+1,N-1); render();
});
window.goto=n=>{i=Math.max(0,Math.min(n,N-1));render();return i};

const REC = {"foundation:finite-lp-strong-duality": {"id": "foundation:finite-lp-strong-duality", "kind": "standard_foundation", "branch": "optimization", "layer": 0, "contract": "A feasible finite-dimensional linear program with finite optimum has an equal dual optimum under the stated primal/dual formulation.", "anchor": "draft.tex:607-614", "status": "DECLARED_BACKGROUND_NOT_RECONSTRUCTED", "state": "CANDIDATE", "decl": "", "prov": "citation only: hamaguchi2024handbook", "artifact": "", "lines": "", "groups": [], "supports": ["relaxed-lp-dual"], "root": true, "form": true, "wave": 4}, "root:gottesman-stabilizer-formalism": {"id": "root:gottesman-stabilizer-formalism", "kind": "external_contract", "branch": "conceptual_foundation", "layer": 0, "contract": "An abelian Pauli subgroup not containing -I defines its common +1 eigenspace; the rank-n, k=0 case defines a pure stabilizer state.", "anchor": "", "status": "SOURCE_ANCHORED", "state": "CANDIDATE", "decl": "", "prov": "arxiv:quant-ph/9705052v1", "artifact": "Reference/Stabilizer Codes and Quantum Error Correction/Thesis.tex", "lines": "980-998", "groups": [], "supports": ["dependency-affine-code", "frustration-graph", "full-stabilizer-polytope", "sign-syndrome-linear-consistent"], "root": true, "form": true, "wave": 4}, "root:howard-campbell-rom": {"id": "root:howard-campbell-rom", "kind": "external_contract", "branch": "conceptual_foundation", "layer": 0, "contract": "RoM is the minimum l1 norm of a signed affine decomposition over pure stabilizer states; RoM=1 exactly on the stabilizer polytope and is nonincreasing under stabilizer operations.", "anchor": "", "status": "SOURCE_ANCHORED", "state": "CANDIDATE", "decl": "", "prov": "arxiv:1609.07488v2", "artifact": "Reference/Application of a resource theory for magic states to fault-tolerant quantum computing/Robustness_main_appendix.tex", "lines": "75-119,208-232", "groups": [], "supports": ["full-rom"], "root": true, "form": true, "wave": 7}, "root:perfect-graph-weighted-duality": {"id": "root:perfect-graph-weighted-duality", "kind": "external_contract", "branch": "graph_theory", "layer": 0, "contract": "For a finite perfect graph and nonnegative weights, the maximum-weight stable-set value equals the fractional clique-cover optimum. This equality contract does not itself include an algorithmic complexity claim.", "anchor": "draft.tex:639-684", "status": "PRIMARY_SOURCE_ALIGNMENT_PENDING", "state": "BLOCKED", "decl": "", "prov": "UNRESOLVED: Chvatal 1975 / Fulkerson 1971/1972", "artifact": "", "lines": "", "groups": [], "supports": ["perfect-graph-antiblocker"], "root": true, "form": false, "wave": 2}, "root:varela-reduced-polytope": {"id": "root:varela-reduced-polytope", "kind": "external_contract", "branch": "reduced_polytope", "layer": 0, "contract": "A Pauli expectation window defines a projected stabilizer polytope and reduced RoM; its claimed V-representation uses maximal commuting contexts and admissible signs.", "anchor": "", "status": "BLOCKED_BY_VREP_PROOF_GAP", "state": "BLOCKED", "decl": "", "prov": "arxiv:2602.18939v1", "artifact": "Reference/Predicting magic from very few measurements/pra_version.tex", "lines": "188-260,279-309,691-808", "groups": [], "supports": ["exact-reduced-vrep", "reduced-rom", "reduced-stabilizer-polytope"], "root": true, "form": false, "wave": 4}, "root:veitch-stabilizer-resource-theory": {"id": "root:veitch-stabilizer-resource-theory", "kind": "external_contract", "branch": "conceptual_foundation", "layer": 0, "contract": "Pure stabilizer states form a finite Clifford orbit; the full free state set STAB is their convex hull; states not freely preparable are magic/nonstabilizer resources, and stabilizer operations are free operations.", "anchor": "", "status": "SOURCE_ANCHORED", "state": "CANDIDATE", "decl": "", "prov": "arxiv:1307.7171v1", "artifact": "Reference/The Resource Theory of Stabilizer Computation/stab_resource_theory_021.tex", "lines": "269-280,331-367,425-482", "groups": [], "supports": ["full-stabilizer-polytope"], "root": true, "form": true, "wave": 6}, "claim:full-rom": {"id": "claim:full-rom", "kind": "definition", "branch": "conceptual_foundation", "layer": 1, "contract": "Full RoM is the minimum l1 norm of a signed affine decomposition of rho over pure stabilizer states, with value one exactly on STAB_n.", "anchor": "draft.tex:83-88,111-114", "status": "IMPORTED_CONCEPT", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["full-stabilizer-polytope", "howard-campbell-rom"]], "supports": ["reduced-rom"], "root": false, "form": true, "wave": 6}, "claim:full-stabilizer-polytope": {"id": "claim:full-stabilizer-polytope", "kind": "definition", "branch": "conceptual_foundation", "layer": 1, "contract": "STAB_n is the convex hull of all pure n-qubit stabilizer states.", "anchor": "draft.tex:81-86,111-114", "status": "IMPORTED_CONCEPT", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["gottesman-stabilizer-formalism", "veitch-stabilizer-resource-theory"]], "supports": ["full-rom", "reduced-stabilizer-polytope"], "root": false, "form": true, "wave": 5}, "claim:pauli-window": {"id": "claim:pauli-window", "kind": "definition", "branch": "reduced_polytope", "layer": 1, "contract": "A finite set M of nonidentity Hermitian n-qubit Pauli observables maps rho to b_M(rho)=(tr(P rho))_{P in M}.", "anchor": "draft.tex:113-115", "status": "SOURCE_EXPLICIT_AGENT_NORMALIZED_DOMAIN", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [], "supports": ["frustration-graph", "reduced-stabilizer-polytope"], "root": true, "form": true, "wave": 4}, "claim:frustration-graph": {"id": "claim:frustration-graph", "kind": "definition", "branch": "reduced_polytope", "layer": 2, "contract": "G_M has one vertex per measured Pauli and an edge exactly for anticommuting pairs; independent sets are pairwise commuting contexts.", "anchor": "draft.tex:89-91,133-141", "status": "SOURCE_EXPLICIT", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["pauli-window", "gottesman-stabilizer-formalism"]], "supports": ["dependency-affine-code", "exact-reduced-vrep", "relaxed-mwis-dual", "sign-syndrome-linear-consistent"], "root": false, "form": true, "wave": 3}, "claim:reduced-rom": {"id": "claim:reduced-rom", "kind": "definition", "branch": "reduced_polytope", "layer": 2, "contract": "RoM_M(rho) is the minimum l1 norm of a signed affine decomposition of b_M(rho) over STAB(M); projection implies RoM_M(rho)<=RoM(rho), so RoM_M(rho)>1 is a sound magic certificate. With M held fixed, it is not a monotone under all stabilizer operations.", "anchor": "draft.tex:122-131,496-500", "status": "DEFINITION_VALID_MONOTONICITY_LABEL_FALSE", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["full-rom", "reduced-stabilizer-polytope", "varela-reduced-polytope"]], "supports": ["relaxed-rom"], "root": false, "form": false, "wave": 5}, "claim:reduced-stabilizer-polytope": {"id": "claim:reduced-stabilizer-polytope", "kind": "definition", "branch": "reduced_polytope", "layer": 2, "contract": "STAB(M) is the image of STAB_n under the Pauli expectation window.", "anchor": "draft.tex:115-121,496-500", "status": "SOURCE_EXPLICIT_IMPORTED_ORIGIN", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["full-stabilizer-polytope", "pauli-window", "varela-reduced-polytope"]], "supports": ["exact-reduced-vrep", "reduced-rom"], "root": false, "form": false, "wave": 4}, "claim:dependency-affine-code": {"id": "claim:dependency-affine-code", "kind": "lemma", "branch": "reduced_polytope", "layer": 3, "contract": "Within a commuting context, phase-free kernel relations with their +/- identity syndromes are exactly the parity checks defining the admissible sign assignments.", "anchor": "draft.tex:514-538", "status": "LOCAL_SOURCE_DERIVATION", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["frustration-graph", "sign-syndrome-linear-consistent", "gottesman-stabilizer-formalism"]], "supports": ["no-active-free-signs", "pauli-active-dependency"], "root": false, "form": true, "wave": 4}, "claim:exact-reduced-vrep": {"id": "claim:exact-reduced-vrep", "kind": "theorem", "branch": "reduced_polytope", "layer": 3, "contract": "STAB(M)=conv{v_(S,f)} over inclusion-maximal commuting contexts S and phase-aware admissible signs f.", "anchor": "draft.tex:137-150,499-510", "status": "BLOCKED_BY_ROOT_CONTRACT", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["frustration-graph", "reduced-stabilizer-polytope", "varela-reduced-polytope"]], "supports": ["relaxation-exactness", "sign-relaxed-polytope"], "root": false, "form": false, "wave": 3}, "claim:mwis-definition": {"id": "claim:mwis-definition", "kind": "definition", "branch": "optimization", "layer": 3, "contract": "For nonnegative vertex weights w, alpha_w(G) is the maximum total weight over all independent sets of G.", "anchor": "draft.tex:245-251", "status": "SOURCE_EXPLICIT_STANDARD_DEFINITION", "state": "KERNEL_CHECKED", "decl": "AgtXIv.GraphFoundation.independentFinsets", "prov": "", "artifact": "", "lines": "", "groups": [], "supports": ["relaxed-mwis-dual"], "root": true, "form": true, "wave": 3}, "claim:perfect-graph-definition": {"id": "claim:perfect-graph-definition", "kind": "definition", "branch": "graph_theory", "layer": 3, "contract": "G is perfect iff every induced subgraph G' satisfies chromatic_number(G')=clique_number(G').", "anchor": "draft.tex:265-268", "status": "SOURCE_EXPLICIT_STANDARD_DEFINITION", "state": "KERNEL_CHECKED", "decl": "AgtXIv.GraphFoundation.IsPerfect", "prov": "", "artifact": "", "lines": "", "groups": [], "supports": ["closed-form-rom", "perfect-graph-antiblocker"], "root": true, "form": true, "wave": 1}, "claim:relaxed-rom": {"id": "claim:relaxed-rom", "kind": "definition", "branch": "relaxation", "layer": 3, "contract": "relaxed_RoM_M is the minimum l1 signed affine decomposition of b_M(rho) over the sign-relaxed polytope.", "anchor": "draft.tex:208-215", "status": "SOURCE_EXPLICIT", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["reduced-rom", "sign-relaxed-polytope"]], "supports": ["relaxed-lp-dual"], "root": false, "form": false, "wave": 4}, "claim:sign-relaxed-polytope": {"id": "claim:sign-relaxed-polytope", "kind": "definition", "branch": "relaxation", "layer": 3, "contract": "The sign-relaxed polytope retains all +/- assignments on every maximal commuting context, including assignments not compatible with Pauli product relations.", "anchor": "draft.tex:196-207", "status": "SOURCE_EXPLICIT", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["exact-reduced-vrep"]], "supports": ["relaxed-affine-span", "relaxed-lp-dual", "relaxed-rom", "sign-alignment-identity"], "root": false, "form": false, "wave": 4}, "claim:sign-syndrome-linear-consistent": {"id": "claim:sign-syndrome-linear-consistent", "kind": "lemma", "branch": "reduced_polytope", "layer": 3, "contract": "For commuting Hermitian Pauli representatives, the product phase defines a linear syndrome on ker(M_S); independent generator eigenvalues extend consistently, so B_S is a nonempty affine coset of size 2^rank(M_S).", "anchor": "draft.tex:522-535 (implicit load-bearing lemma)", "status": "AGENT_EXPLICITATION_REQUIRES_PROOF_AUDIT", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["frustration-graph", "gottesman-stabilizer-formalism"]], "supports": ["dependency-affine-code"], "root": false, "form": true, "wave": 5}, "claim:pauli-active-dependency": {"id": "claim:pauli-active-dependency", "kind": "definition", "branch": "relaxation", "layer": 4, "contract": "An inclusion-minimal Pauli product relation is active exactly when its support is pairwise commuting and therefore imposes a joint-eigenvalue parity check.", "anchor": "draft.tex:222-233", "status": "SOURCE_EXPLICIT", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["dependency-affine-code"]], "supports": ["no-active-free-signs"], "root": false, "form": true, "wave": 4}, "claim:relaxed-affine-span": {"id": "claim:relaxed-affine-span", "kind": "lemma", "branch": "optimization", "layer": 4, "contract": "For every measured coordinate i, a maximal commuting context containing i and a one-sign flip yield a vertex difference proportional to e_i; hence the relaxed primal is feasible for every b in R^m and bounded below by one.", "anchor": "draft.tex:607-609", "status": "HIDDEN_LOCAL_LEMMA_RECONSTRUCTED", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["sign-relaxed-polytope"]], "supports": ["relaxed-lp-dual"], "root": false, "form": false, "wave": 4}, "claim:no-active-free-signs": {"id": "claim:no-active-free-signs", "kind": "lemma", "branch": "relaxation", "layer": 5, "contract": "M has no Pauli-active dependency iff every commuting context admits every deterministic sign assignment.", "anchor": "draft.tex:228-233,546-570", "status": "LOCAL_SOURCE_DERIVATION", "state": "CANDIDATE", "decl": "", "prov": "", "artifact": "", "lines": "", "groups": [["dependency-affine-code", "pauli-active-dependency"]], "supports": ["relaxation-exactness", "sign-alignment-identity"], "root": false, "form": true, "wave": 3}, "claim:perfect-graph-antiblocker": {"id": "claim:perfect-graph-antiblocker", "kind": "lemma", "branch": "graph_theory", "layer": 5, "contract": "For a perfect graph, {z>=0:alpha_z<=1} is the convex hull of clique incidence vectors including the empty clique. The target derives this locally from weighted stable-set/fractional-cover duality and downward closure.", "anchor": "draft.tex:671-675,680-684", "status": "LOCAL_SYNTHESIS_BLOCKED_BY_WEIGHTED_DUALITY_ALIGNMENT", "state": "CANDIDATE", "decl": "", "pro const insp=document.getElementById('insp'), hint=document.getElementById('hint');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function showNode(id){
  const r=REC[id]; if(!r) return;
  document.getElementById('ih').textContent=id;
  document.getElementById('isub').textContent=
    `${r.kind.replace(/_/g,' ')}  ·  ${r.branch.replace(/_/g,' ')}  ·  layer ${r.layer}`;
  document.getElementById('ic').textContent=r.contract||'(no contract recorded)';
  const row=(k,v,cls)=> v ? `<dt>${k}</dt><dd class="${cls||''}">${esc(v)}</dd>` : '';
  const grp = r.groups.length
    ? r.groups.map(ms=>`<div class="grp">${ms.map(esc).join('  <em>AND</em>  ')}</div>`).join('')
    : '<span class="warm">nothing — this is a root</span>';
  document.getElementById('idl').innerHTML =
    row('source', r.anchor) + row('paper', r.prov, r.prov.startsWith('UNRESOLVED')?'warm':'') +
    row('artifact', r.artifact) + row('lines', r.lines) +
    row('status', r.status) + row('state', r.state, r.state==='BLOCKED'?'warm':'') +
    row('lean', r.decl) +
    `<dt>discharged by</dt><dd>${grp}</dd>` +
    row('supports', r.supports.join(', ')) +
    row('formalizable', r.form ? 'yes — in formalization_order' : 'no — downstream of a blocked root',
        r.form?'':'warm') +
    row('enters at', 'step '+r.wave);
  insp.classList.add('on'); hint.style.display='none';
}
function hideNode(){ insp.classList.remove('on'); hint.style.display=''; }
document.getElementById('ix').addEventListener('click', e=>{e.stopPropagation(); hideNode();});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') hideNode(); });
document.addEventListener('click', e=>{
  const n=e.target.closest('.ch-node');
  if(n){ e.stopPropagation(); showNode(n.dataset.id); }
}, true);

 const el=selectedGroup===null?null:document.querySelector('.dependency-group[data-group="'+selectedGroup+'"]');
 const active=el&&el.classList.contains('on')&&!fig.classList.contains('off');
 fig.classList.toggle('has-selection',!!active);
 document.querySelectorAll('.dependency-group').forEach(x=>x.classList.toggle('selected',active&&x===el));
