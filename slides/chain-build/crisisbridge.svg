<svg class="pipe-svg" data-cum="0" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Before asking whether the output can be trusted, look at what the machine is doing when it produces it.">
<defs><marker id="crbah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="crbaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <text x="150.0" y="425.4" text-anchor="start" font-size="54" fill="#1A1A16" class="pp-t">Before asking whether we can trust what it writes,</text>
    <text x="150.0" y="501.4" text-anchor="start" font-size="54" fill="#1A1A16" class="pp-t">look at what it is doing when it writes.</text>
    <line x1="150.0" y1="584.0" x2="700.0" y2="584.0" stroke="#8A8A80" stroke-width="1.4"/>
    <text x="150.0" y="641.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">Nothing in the next four frames is a criticism. It is a description.</text>
  </g>
</svg>