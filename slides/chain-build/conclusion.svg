<svg class="pipe-svg" data-cum="0" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What was shown, what it cost, and where it stops.">
<defs><marker id="cclah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="cclaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <text x="150.0" y="168.6" text-anchor="start" font-size="46" fill="#1A1A16" class="pp-t">Where this actually is</text>
    <rect x="150.0" y="230.0" width="190.0" height="68.0" fill="none" stroke="#1A1A16" stroke-width="2.8"/>
    <text x="168.0" y="270.2" text-anchor="start" font-size="24" fill="#1A1A16" class="pp-t">shown</text>
    <text x="376.0" y="268.2" text-anchor="start" font-size="24" fill="#1A1A16" class="pp-t">One paper, frozen. 29 claims and 46 dependencies for one theorem, and a chain that runs.</text>
    <rect x="150.0" y="328.0" width="190.0" height="68.0" fill="none" stroke="#1A1A16" stroke-width="2.8"/>
    <text x="168.0" y="368.2" text-anchor="start" font-size="24" fill="#1A1A16" class="pp-t">shown</text>
    <text x="376.0" y="366.2" text-anchor="start" font-size="24" fill="#1A1A16" class="pp-t">Removing a claim has a measurable cost, so the structure can say which parts carry load.</text>
    <rect x="150.0" y="426.0" width="190.0" height="68.0" fill="none" stroke="#8A8A80" stroke-width="1.6"/>
    <text x="168.0" y="466.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">not yet</text>
    <text x="376.0" y="464.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">The 613-claim extraction is not usable: every node is blocked pending review, and nothing is accepted.</text>
    <rect x="150.0" y="524.0" width="190.0" height="68.0" fill="none" stroke="#8A8A80" stroke-width="1.6"/>
    <text x="168.0" y="564.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">not yet</text>
    <text x="376.0" y="562.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">The chain rests on a DAG written by hand, for this paper. Automatic library lookup is zero lines of code.</text>
    <rect x="150.0" y="622.0" width="190.0" height="68.0" fill="none" stroke="#8A8A80" stroke-width="1.6"/>
    <text x="168.0" y="662.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">not shown</text>
    <text x="376.0" y="660.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">Whether the formal object means the physics you had in mind. No kernel judges that.</text>
    <line x1="150.0" y1="760.0" x2="1770.0" y2="760.0" stroke="#8A8A80" stroke-width="1.4"/>
    <text x="150.0" y="824.6" text-anchor="start" font-size="34" fill="#1A1A16" class="pp-t">The claim is not that this works. It is that it is now small enough to argue about.</text>
    <text x="150.0" y="876.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">Everything on this frame is one paper and one run — a possibility with a receipt, not a result.</text>
  </g>
</svg>