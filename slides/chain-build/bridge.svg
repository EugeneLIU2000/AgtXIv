<svg class="pipe-svg" data-cum="0" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Of the four things a theorist might want to trust, this talk is about mathematical correctness, and about one paper and one theorem.">
<defs><marker id="briah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="briaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <rect x="150.0" y="250.0" width="760.0" height="180.0" fill="none" stroke="#8A8A80" stroke-width="1.8"/>
    <text x="176.0" y="301.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">The story</text>
    <text x="176.0" y="360.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">What did the paper actually state?</text>
    <rect x="980.0" y="250.0" width="760.0" height="180.0" fill="none" stroke="#1A1A16" stroke-width="3.6"/>
    <text x="1006.0" y="301.8" text-anchor="start" font-size="26" fill="#1A1A16" class="pp-t">Mathematical correctness</text>
    <text x="1006.0" y="360.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">Does the conclusion follow from encoded assumptions?</text>
    <rect x="150.0" y="480.0" width="760.0" height="180.0" fill="none" stroke="#8A8A80" stroke-width="1.8"/>
    <text x="176.0" y="531.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">Computational reproducibility</text>
    <text x="176.0" y="590.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">Can the numerical result be reproduced?</text>
    <rect x="980.0" y="480.0" width="760.0" height="180.0" fill="none" stroke="#8A8A80" stroke-width="1.8"/>
    <text x="1006.0" y="531.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">Physical-semantic alignment</text>
    <text x="1006.0" y="590.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">Does the formal object represent the intended physics?</text>
    <line x1="150.0" y1="760.0" x2="1710.0" y2="760.0" stroke="#8A8A80" stroke-width="1.4"/>
    <text x="150.0" y="811.8" text-anchor="start" font-size="26" fill="#1A1A16" class="pp-t">one paper · one theorem · and what it actually rests on</text>
    <text x="150.0" y="860.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">not whether the formalisation means the physics you had in mind — no kernel judges that</text>
    <text x="150.0" y="894.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">and not reproducibility — there is no numerical claim in the case study</text>
  </g>
</svg>