<text class="k" x="150" y="288.5" xml:space="preserve">as the paper states it</text>
<text class="v" x="150" y="323.5" xml:space="preserve">   RoM_M(rho) = max( 1, max_Q sum_{P in Q} |tr(P rho)| )</text>
<line class="r" x1="150" y1="365.75" x2="1770" y2="365.75"/>
<text class="k" x="150" y="395.75" xml:space="preserve">structured_statement  —  what that one sentence actually contains</text>
<text class="k" x="150" y="450.0">assumptions.explicit</text>
<text class="v" x="590" y="450.0" xml:space="preserve">M has no active dependencies</text>
<text class="k" x="150" y="485.0"></text>
<text class="v" x="590" y="485.0" xml:space="preserve">G_M is perfect</text>
<text class="k" x="150" y="520.0">assumptions.source_implicit</text>
<text class="v" x="590" y="520.0" xml:space="preserve">m &gt;= 1     found in the PROOF, not the statement</text>
<text class="k" x="150" y="555.0">quantifiers</text>
<text class="v" x="590" y="555.0" xml:space="preserve">4  —  3 SOURCE_IMPLICIT (n, m, M),  1 SOURCE_EXPLICIT (rho)</text>
<text class="k" x="150" y="590.0">local_binders</text>
<text class="v" x="590" y="590.0" xml:space="preserve">Q over Cliques(G_M)</text>
<text class="k" x="150" y="625.0">conventions</text>
<text class="v" x="590" y="625.0" xml:space="preserve">The empty clique is allowed and contributes 0.</text>
<text class="k" x="150" y="660.0">conclusion</text>
<text class="v" x="590" y="660.0" xml:space="preserve">RoM_M(rho) = max{ 1, max_{Q in Cliques(G_M)} sum_{P in Q} |tr(P rho)| }</text>
