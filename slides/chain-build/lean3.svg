<svg class="pipe-svg" data-cum="0" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nobody proves from nothing: Mathlib, Quantumlib and this project’s own files, and the gap where a physics library would be.">
<defs><marker id="lncah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="lncaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <text x="150.0" y="167.0" text-anchor="start" font-size="44" fill="#1A1A16" class="pp-t">Nobody proves anything from nothing</text>
    <text x="150.0" y="221.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">Every proof above stands on definitions somebody else already wrote and checked.</text>
    <text x="150.0" y="323.7" text-anchor="start" font-size="52" fill="#8A8A80" class="pp-t">8,450</text>
    <text x="440.0" y="310.9" text-anchor="start" font-size="32" fill="#1A1A16" class="pp-t">Mathlib</text>
    <text x="440.0" y="348.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">the mathematics. 11 GB on disk here, pinned to one revision.</text>
    <text x="150.0" y="443.7" text-anchor="start" font-size="52" fill="#8A8A80" class="pp-t">29</text>
    <text x="440.0" y="430.9" text-anchor="start" font-size="32" fill="#1A1A16" class="pp-t">Quantumlib</text>
    <text x="440.0" y="468.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">stabilizers, Cliffords, density matrices. It stands on Mathlib.</text>
    <text x="150.0" y="563.7" text-anchor="start" font-size="52" fill="#1A1A16" class="pp-t">66</text>
    <text x="440.0" y="550.9" text-anchor="start" font-size="32" fill="#1A1A16" class="pp-t">this paper</text>
    <text x="440.0" y="588.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">written by hand, for one theorem. The only part that is ours.</text>
    <text x="150.0" y="664.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">.lean files, counted on this machine</text>
    <line x1="150.0" y1="700.0" x2="1770.0" y2="700.0" stroke="#8A8A80" stroke-width="1.4"/>
    <text x="150.0" y="755.2" text-anchor="start" font-size="30" fill="#8A8A80" class="pp-t">Drawn to scale, the bottom two rows would be a pixel wide. That is the point.</text>
    <text x="150.0" y="818.6" text-anchor="start" font-size="34" fill="#1A1A16" class="pp-t">Mathematics has one of these. Physics does not.</text>
    <text x="150.0" y="868.2" text-anchor="start" font-size="24" fill="#8A8A80" class="pp-t">Every object our subject needs that Mathlib lacks has to be built first — most of why this is hard for us.</text>
  </g>
</svg>