<svg class="pipe-svg" data-cum="0" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nobody proves from nothing: Mathlib for the mathematics, physlib for the physics, and everything a paper needs that is in neither.">
<defs><marker id="lncah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A16"/></marker><marker id="lncaw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8C4A2F"/></marker></defs>
  <g class="pp-g" data-step="0">
    <text x="150.0" y="167.0" text-anchor="start" font-size="44" fill="#1A1A16" class="pp-t">Nobody proves anything from nothing</text>
    <text x="150.0" y="221.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">Every proof stands on definitions somebody else already wrote and checked.</text>
    <text x="150.0" y="343.7" text-anchor="start" font-size="52" fill="#1A1A16" class="pp-t">9,146</text>
    <text x="150.0" y="380.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">.lean files</text>
    <text x="440.0" y="332.6" text-anchor="start" font-size="34" fill="#1A1A16" class="pp-t">Mathlib</text>
    <text x="440.0" y="372.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">the mathematics. Groups, measure, linear algebra, polytopes.  Begun 2017.</text>
    <text x="150.0" y="493.7" text-anchor="start" font-size="52" fill="#8A8A80" class="pp-t">927</text>
    <text x="150.0" y="530.8" text-anchor="start" font-size="20" fill="#8A8A80" class="pp-t">.lean files</text>
    <text x="440.0" y="482.6" text-anchor="start" font-size="34" fill="#1A1A16" class="pp-t">physlib</text>
    <text x="440.0" y="522.5" text-anchor="start" font-size="22" fill="#8A8A80" class="pp-t">the physics. An open-source community project to digitalize results from physics into Lean 4.  Begun 2024.</text>
    <line x1="150.0" y1="640.0" x2="1770.0" y2="640.0" stroke="#8A8A80" stroke-width="1.4"/>
    <text x="150.0" y="702.6" text-anchor="start" font-size="34" fill="#1A1A16" class="pp-t">Ten times the size, and seven years of a head start.</text>
    <text x="150.0" y="759.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">So the question for any paper is not "can Lean express this" — it is how much of what the paper</text>
    <text x="150.0" y="797.8" text-anchor="start" font-size="26" fill="#8A8A80" class="pp-t">stands on already exists, and how much somebody has to build first.</text>
    <text x="150.0" y="859.8" text-anchor="start" font-size="26" fill="#1A1A16" class="pp-t">For a physics paper today, the honest answer is: a great deal has to be built first.</text>
  </g>
</svg>